            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    post:
      summary: 创建租户并设置首位租户管理员
      operationId: platformTenantCreate
      tags: [Platform Tenant]
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlatformTenantRequest"
      responses:
        "201":
          description: 租户创建并完成初始化
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTenantProvisioningResponseEnvelope"
        "409":
          description: 租户编码或管理员关系冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /platform/tenants/{tenantId}:
    parameters:
      - in: path
        name: tenantId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 获取平台租户详情
      operationId: platformTenantGet
      tags: [Platform Tenant]
      security:
        - platformBearerAuth: []
      responses:
        "200":
          description: 平台租户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTenantResponseEnvelope"
        "404":
          description: 租户不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    patch:
      summary: 修改平台租户资料
      operationId: platformTenantUpdate
      tags: [Platform Tenant]
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlatformTenantRequest"
      responses:
        "200":
          description: 修改后的平台租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTenantResponseEnvelope"
        "409":
          description: 乐观锁版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /platform/tenants/{tenantId}/suspend:
    post:
      summary: 停用租户并撤销全部租户会话
      operationId: platformTenantSuspend
      tags: [Platform Tenant]
      security:
        - platformBearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendPlatformTenantRequest"
      responses:
        "200":
          description: 已停用的租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTenantResponseEnvelope"

  /platform/tenants/{tenantId}/restore:
    post:
      summary: 恢复租户
      operationId: platformTenantRestore
      tags: [Platform Tenant]
      security:
        - platformBearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: 已恢复的租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTenantResponseEnvelope"
        "409":
          description: 租户尚无有效管理员或版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /platform/tenants/{tenantId}/administrators:
    get:
      summary: 查询租户管理员
      operationId: platformTenantListAdministrators
      tags: [Platform Tenant]
      security:
        - platformBearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 租户管理员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTenantAdministratorListResponseEnvelope"
    post:
      summary: 设置租户管理员
      operationId: platformTenantAssignAdministrator
      tags: [Platform Tenant]
      security:
        - platformBearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPlatformTenantAdministratorRequest"
      responses:
        "200":
          description: 已设置管理员或创建管理员邀请
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTenantAdministratorAssignmentResponseEnvelope"

  /platform/tenants/{tenantId}/administrators/{membershipId}:
    delete:
      summary: 取消租户管理员角色
      operationId: platformTenantRemoveAdministrator
      tags: [Platform Tenant]
      security:
        - platformBearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: membershipId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已取消租户管理员角色
        "409":
          description: 不能移除最后一名有效租户管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /platform/audit-events:
    get:
      summary: 查询平台审计事件
      operationId: platformAuditList
      tags: [Platform Audit]
      security:
        - platformBearerAuth: []
      parameters:
        - in: query
          name: action
          schema:
            type: string
            maxLength: 100
        - in: query
          name: outcome
          schema:
            $ref: "#/components/schemas/AuditOutcome"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: cursor
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 平台审计事件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAuditEventListResponseEnvelope"

  /platform/audit-events/{auditEventId}:
    get:
      summary: 获取平台审计事件详情
      operationId: platformAuditGet
      tags: [Platform Audit]
      security:
        - platformBearerAuth: []
      parameters:
        - in: path
          name: auditEventId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 平台审计事件详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAuditEventResponseEnvelope"

  /tenants/current/invitations:
    get:
      summary: 查询当前租户成员邀请
      operationId: tenantInvitationList
      tags: [Tenant]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/TenantInvitationStatus"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: cursor
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 当前租户邀请列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitationListResponseEnvelope"
    post:
      summary: 邀请成员加入当前租户
      operationId: tenantInvitationCreate
      tags: [Tenant]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInvitationRequest"
      responses:
        "201":
          description: 邀请已创建；令牌只在本次响应返回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitationCreatedResponseEnvelope"
        "409":
          description: 用户已是成员或已存在有效邀请
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current/invitations/{invitationId}:
    delete:
      summary: 撤销当前租户成员邀请
      operationId: tenantInvitationRevoke
      tags: [Tenant]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 邀请已撤销

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TenantStatus:
      type: string
      enum:
        - PENDING_ACTIVATION
        - ACTIVE
        - SUSPENDED

    PlatformRole:
      type: string
      enum:
        - SUPER_ADMIN

    PlatformLoginRequest:
      type: object
      additionalProperties: false
      required:
        - account
        - password
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        deviceName:
          type: string
          minLength: 1
          maxLength: 100

    PlatformAdministratorIdentity:
      type: object
      required:
        - id
        - account
        - user
        - role
        - permissions
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
        role:
          $ref: "#/components/schemas/PlatformRole"
        permissions:
          type: array
          items:
            type: string

    PlatformLoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPairResponse"
        - type: object
          required:
            - administrator
          properties:
            administrator:
              $ref: "#/components/schemas/PlatformAdministratorIdentity"

    PlatformMeResponse:
      type: object
      required:
        - administrator
      properties:
        administrator:
          $ref: "#/components/schemas/PlatformAdministratorIdentity"

    InitialTenantAdministratorRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 120

    CreatePlatformTenantRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - initialAdministrator
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        name:
          type: string
          minLength: 1
          maxLength: 120
        initialAdministrator:
          $ref: "#/components/schemas/InitialTenantAdministratorRequest"

    UpdatePlatformTenantRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        version:
          type: integer
          minimum: 1

    SuspendPlatformTenantRequest:
      type: object
      additionalProperties: false
      required:
        - reason
        - version
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        version:
          type: integer
          minimum: 1

    VersionRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1

    AssignPlatformTenantAdministratorRequest:
      type: object
      additionalProperties: false
      required:
        - account
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 120

    PlatformTenantDetail:
      type: object
      required:
        - id
        - code
        - name
        - status
        - activeAdministratorCount
        - pendingInvitationCount
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        activeAdministratorCount:
          type: integer
          minimum: 0
        pendingInvitationCount:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlatformTenantList:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformTenantDetail"
        nextCursor:
          type: [string, "null"]
          format: uuid

    PlatformTenantAdministrator:
      type: object
      required:
        - membershipId
        - account
        - user
        - status
        - joinedAt
      properties:
        membershipId:
          type: string
          format: uuid
        account:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
        status:
          $ref: "#/components/schemas/MemberStatus"
        joinedAt:
          type: string
          format: date-time

    PlatformTenantAdministratorList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformTenantAdministrator"

    TenantAdministratorAssignmentStatus:
      type: string
      enum:
        - ASSIGNED
        - INVITED

    PlatformTenantAdministratorAssignment:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/TenantAdministratorAssignmentStatus"
        administrator:
          $ref: "#/components/schemas/PlatformTenantAdministrator"
        invitation:
          $ref: "#/components/schemas/TenantInvitation"
        invitationToken:
          type: string
          minLength: 32

    PlatformTenantProvisioningResponse:
      type: object
      required:
        - tenant
        - administratorAssignment
      properties:
        tenant:
          $ref: "#/components/schemas/PlatformTenantDetail"
        administratorAssignment:
          $ref: "#/components/schemas/PlatformTenantAdministratorAssignment"

    TenantInvitationStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - REVOKED
        - EXPIRED

    TenantInvitation:
      type: object
      required:
        - id
        - tenantId
        - account
        - status
        - isInitialAdministrator
        - roleIds
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        account:
          type: string
        displayName:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/TenantInvitationStatus"
        isInitialAdministrator:
          type: boolean
        roleIds:
          type: array
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    TenantInvitationCreated:
      type: object
      required:
        - invitation
        - invitationToken
      properties:
        invitation:
          $ref: "#/components/schemas/TenantInvitation"
        invitationToken:
          type: string
          minLength: 32

    TenantInvitationList:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantInvitation"
        nextCursor:
          type: [string, "null"]
          format: uuid

    CreateTenantInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
        - roleIds
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        roleIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            format: uuid

    AcceptTenantInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - tenantCode
        - account
        - invitationToken
        - password
      properties:
        tenantCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        invitationToken:
          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    TenantInvitationAcceptance:
      type: object
      required:
        - tenant
        - membership
      properties:
        tenant:
          $ref: "#/components/schemas/AuthTenant"
        membership:
          $ref: "#/components/schemas/TenantMember"

    PlatformAuditEvent:
      type: object
      required:
        - id
        - action
        - outcome
        - resourceType
        - requestId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        actorUserId:
          type: [string, "null"]
          format: uuid
        actorPlatformAdministratorId:
          type: [string, "null"]
          format: uuid
        resourceType:
          type: string
        resourceId:
          type: [string, "null"]
          format: uuid
        requestId:
          type: string
        ipAddress:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
        metadata:
          type: [object, "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    PlatformAuditEventList:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformAuditEvent"
        nextCursor:
          type: [string, "null"]
          format: uuid

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - tenantCode
        - account
        - password
      properties:
        tenantCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
        deviceName:
          type: string
          minLength: 1
          maxLength: 100

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 512

    AuthUser:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    AuthTenant:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string

    AuthMembership:
      type: object
      required:
        - id
        - account
        - status
        - roles
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
        roles:
          type: array
          items:
            type: string

    MemberStatus:
      type: string
      enum:
        - PENDING_ACTIVATION
        - ACTIVE
        - DISABLED

    TenantDetail:
      type: object
      required:
        - id
        - code
        - name
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateTenantRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        version:
          type: integer
          minimum: 1

    TenantMemberRole:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string

    TenantMember:
      type: object
      required:
        - id
        - account
        - user
        - status
        - roles
        - joinedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
        departmentId:
          type:
            - string
            - "null"
          format: uuid
        status:
          $ref: "#/components/schemas/MemberStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TenantMemberRole"
        joinedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1

    TenantMemberList:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantMember"
        nextCursor:
          type:
            - string
            - "null"
          format: uuid

    UpdateTenantMemberRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        departmentId:
          type:
            - string
            - "null"
          format: uuid
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        version:
          type: integer
          minimum: 1

    DepartmentStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    DepartmentSummary:
      type: object
      required:
        - id
        - parentId
        - name
        - description
        - sortOrder
        - status
        - memberCount
        - childCount
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type:
            - string
            - 'null'
          format: uuid
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        sortOrder:
          type: integer
        status:
          $ref: '#/components/schemas/DepartmentStatus'
        memberCount:
          type: integer
          minimum: 0
        childCount:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DepartmentTreeNode:
      allOf:
        - $ref: '#/components/schemas/DepartmentSummary'
        - type: object
          required:
            - children
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/DepartmentTreeNode'

    DepartmentTree:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentTreeNode'

    CreateDepartmentRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        parentId:
          type:
            - string
            - 'null'
          format: uuid
          default: null
        description:
          type:
            - string
            - 'null'
