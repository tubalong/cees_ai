  /knowledge-bases/{knowledgeBaseId}/members/{membershipId}:
    parameters:
      - name: knowledgeBaseId
        in: path
        required: true
        description: 知识库 ID
        schema: { type: string, format: uuid }
      - name: membershipId
        in: path
        required: true
        description: 租户成员 ID
        schema: { type: string, format: uuid }
    patch:
      summary: 修改知识库成员权限
      description: 知识库创建者必须始终保留 MANAGER 权限。
      operationId: updateKnowledgeBaseMember
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateKnowledgeBaseMemberRequest' }
      responses:
        '200':
          description: 知识库成员权限已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeBaseMemberResponseEnvelope' }
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.member.manage 权限或知识库 MANAGER 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库或成员不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '409':
          description: 不允许降低知识库创建者权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

    delete:
      summary: 移除知识库成员
      description: 知识库创建者不能被移除；不能移除最后一名 MANAGER。
      operationId: removeKnowledgeBaseMember
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 知识库成员已移除
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.member.manage 权限或知识库 MANAGER 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库或成员不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '409':
          description: 不允许移除创建者或最后一名 MANAGER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    KnowledgeBaseMemberPermission:
      type: string
      enum: [READER, EDITOR, MANAGER]
      description: 知识库成员权限，从低到高分别为只读、编辑和管理

    KnowledgeBase:
      type: object
      required:
        - id
        - tenantId
        - name
        - description
        - memberCount
        - createdBy
        - updatedBy
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        memberCount:
          type: integer
          minimum: 0
        createdBy:
          type: [string, 'null']
          format: uuid
        updatedBy:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KnowledgeBaseList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeBase'
        nextCursor:
          type: [string, 'null']
          format: uuid

    KnowledgeBaseMember:
      type: object
      required:
        - id
        - tenantId
        - knowledgeBaseId
        - membershipId
        - userId
        - account
        - displayName
        - permission
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        knowledgeBaseId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        account:
          type: string
        displayName:
          type: string
        permission:
          $ref: '#/components/schemas/KnowledgeBaseMemberPermission'
        createdAt:
          type: string
          format: date-time

    KnowledgeBaseMemberList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeBaseMember'
        nextCursor:
          type: [string, 'null']
          format: uuid

    CreateKnowledgeBaseRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000

    UpdateKnowledgeBaseRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000
        version:
          type: integer
          minimum: 1

    CreateKnowledgeBaseMemberRequest:
      type: object
      additionalProperties: false
      required: [membershipId, permission]
      properties:
        membershipId:
          type: string
          format: uuid
          description: 当前租户成员 ID，而不是全局用户 ID
        permission:
          $ref: '#/components/schemas/KnowledgeBaseMemberPermission'

    UpdateKnowledgeBaseMemberRequest:
      type: object
      additionalProperties: false
      required: [permission]
      properties:
        permission:
          $ref: '#/components/schemas/KnowledgeBaseMemberPermission'

    ChatMode:
      type: string
      enum: [standard, ultra]
      default: standard
      description: 对话执行模式；省略时使用 standard

    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 128

    UpdateConversationRequest:
      type: object
      additionalProperties: false
      required: [title, version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          description: 新的会话标题
        version:
          type: integer
          minimum: 1
          description: 当前会话版本，用于防止并发覆盖

    ConversationVisibility:
      type: string
      enum: [PRIVATE]
      default: PRIVATE
      description: 会话可见性；当前仅支持成员私有

    Conversation:
      type: object
      additionalProperties: false
      required: [id, title, visibility, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
          description: 会话 ID
        title:
          type: string
          maxLength: 128
          description: 会话标题；未自动生成前为空字符串
        visibility:
          $ref: '#/components/schemas/ConversationVisibility'
        createdAt:
          type: string
          format: date-time
          description: 会话创建时间
        updatedAt:
          type: string
          format: date-time
          description: 会话最近更新时间
        lastTurnAt:
          type: [string, 'null']
          format: date-time
          description: 最近一轮发起时间；尚未发起过轮次时为 null
        version:
          type: integer
          minimum: 1
          description: 会话资源版本；创建、发起轮次、改标题和删除都会递增

    ConversationResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Conversation'
        requestId:
          type: [string, 'null']
          description: 公开 API 请求追踪 ID

    ConversationListResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: 按更新时间倒序排列的会话
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          type: [string, 'null']
          description: 下一页游标；没有更多数据时为 null

    ConversationListResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ConversationListResult'
        requestId:
          type: [string, 'null']
          description: 公开 API 请求追踪 ID

    ConversationMessageRole:
      type: string
      enum: [USER, ASSISTANT, TOOL]
      description: 服务端持久化的会话消息角色

    ConversationMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, imageFileIds, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 服务端生成的消息 ID
        role:
          $ref: '#/components/schemas/ConversationMessageRole'
        content:
          type: string
          maxLength: 262144
          description: 消息正文
        imageFileIds:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Stable image FileObject IDs; signed URLs are resolved only at model invocation time
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
          description: 消息写入时间
        turnId:
          type: [string, 'null']
          format: uuid
          description: 消息归属的轮次；未关联轮次时为 null
        toolCallId:
          type: [string, 'null']
          format: uuid
          description: TOOL 角色消息对应的工具调用 ID；其他角色为 null

    ConversationDetail:
      type: object
      additionalProperties: false
      required: [conversation, messages]
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          maxItems: 100
          description: 按时间升序排列的最近消息，最多 100 条
          items:
            $ref: '#/components/schemas/ConversationMessage'

    ConversationDetailResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ConversationDetail'
        requestId:
          type: [string, 'null']
          description: 公开 API 请求追踪 ID

    CreateTurnRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [content]
          properties:
            content:
              type: string
              minLength: 1
        - required: [imageFileIds]
          properties:
            imageFileIds:
              type: array
              minItems: 1
      properties:
        content:
          type: [string, 'null']
          minLength: 1
          maxLength: 262144
          description: 本轮 user 消息正文；历史消息与摘要由服务端加载
        imageFileIds:
          type: array
          maxItems: 8
          minItems: 1
          uniqueItems: true
          description: Stable image FileObject IDs referenced by this user message
          items:
            type: string
            format: uuid
        mode:
          $ref: '#/components/schemas/ChatMode'

    TurnStatus:
      type: string
      enum: [RECEIVED, RUNNING, COMPLETED, FAILED, CANCELLED]
      description: 轮次状态；RECEIVED 为已接收未开始，RUNNING 为执行中

    Turn:
      type: object
      additionalProperties: false
      required: [id, conversationId, status, mode, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 轮次 ID
        conversationId:
          type: string
          format: uuid
          description: 所属会话 ID
        status:
          $ref: '#/components/schemas/TurnStatus'
        mode:
          $ref: '#/components/schemas/ChatMode'
        error:
          type: [object, 'null']
          description: 轮次失败时的错误信息；其他状态为 null
        createdAt:
          type: string
          format: date-time
          description: 轮次创建时间
        completedAt:
          type: [string, 'null']
          format: date-time
          description: 轮次到达终态的时间；未结束时为 null

    TurnResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Turn'
        requestId:
          type: [string, 'null']
          description: 公开 API 请求追踪 ID

    ChatTokenUsage:
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens, totalTokens]
      properties:
        inputTokens:
          type: [integer, 'null']
          minimum: 0
          description: Provider 报告的输入 Token；未报告时为 null
        outputTokens:
          type: [integer, 'null']
          minimum: 0
          description: Provider 报告的输出 Token；未报告时为 null
        totalTokens:
          type: [integer, 'null']
          minimum: 0
          description: Provider 报告的总 Token；未报告时为 null

    ChatContextStrategy:
      type: string
      enum: [full, summary_plus_recent, recent_only]
      description: ai-service 实际采用的上下文策略

    ChatContextUsage:
      type: object
      additionalProperties: false
      required: [strategy, receivedMessageCount, includedMessageCount, historyTruncated, estimatedInputTokens]
      properties:
        strategy:
          $ref: '#/components/schemas/ChatContextStrategy'
        receivedMessageCount:
          type: integer
          minimum: 1
          description: API 向 ai-service 提交的消息条数
        includedMessageCount:
          type: integer
          minimum: 1
          description: 上下文预算处理后实际纳入的消息条数
        historyTruncated:
          type: boolean
          description: 是否因上下文预算舍弃了较早消息
        estimatedInputTokens:
          type: integer
          minimum: 1
          description: ai-service 在模型调用前估算的输入 Token

    TurnStreamStartedEvent:
      type: object
      additionalProperties: false
      required: [type, seq, requestId, conversationId, turnId, mode, contextUsage]
      properties:
        type:
          type: string
          const: started
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号，用于断线重连时定位重放起点
        requestId:
          type: string
          description: 公开 API 请求追踪 ID
        conversationId:
          type: string
          format: uuid
          description: 所属服务端会话 ID
        turnId:
          type: string
          format: uuid
          description: 本轮轮次 ID
        mode:
          $ref: '#/components/schemas/ChatMode'
        contextUsage:
          $ref: '#/components/schemas/ChatContextUsage'

    TurnPhase:
      type: string
      enum: [reasoning, answering, tool_executing]
      description: 当前只公开推理中、回答中或工具执行中阶段，不公开模型原始推理正文

    TurnStreamStatusEvent:
      type: object
      additionalProperties: false
      required: [type, seq, phase]
      properties:
        type:
          type: string
          const: status
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        phase:
          $ref: '#/components/schemas/TurnPhase'

    TurnStreamContentDeltaEvent:
      type: object
      additionalProperties: false
      required: [type, seq, text]
      properties:
        type:
          type: string
          const: content_delta
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        text:
          type: string
          description: 本次新增的回答正文片段

    TurnStreamUsageEvent:
      type: object
      additionalProperties: false
      required: [type, seq, tokenUsage]
      properties:
        type:
          type: string
          const: usage
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        tokenUsage:
          $ref: '#/components/schemas/ChatTokenUsage'

    TurnStreamToolCallEvent:
      type: object
      additionalProperties: false
      required: [type, seq, toolCallId, name, arguments]
      properties:
        type:
          type: string
          const: tool_call
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        toolCallId:
          type: string
          format: uuid
          description: 本次工具调用的稳定标识
        name:
          type: string
          description: 模型请求执行的受控工具名
        arguments:
          type: object
          additionalProperties: true
          description: 模型生成并经过 API 校验的工具参数
      description: 模型请求执行一个受控工具；具体是否执行由 API 根据权限、能力和额度决定。

    TurnStreamToolResultEvent:
      type: object
      additionalProperties: false
      required: [type, seq, toolCallId, status, resource, error]
      properties:
        type:
          type: string
          const: tool_result
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        toolCallId:
          type: string
          format: uuid
          description: 对应 TurnStreamToolCallEvent 中的 toolCallId
        status:
          type: string
          enum: [completed, failed, rejected]
          description: 工具执行结果状态
        resource:
          oneOf:
            - $ref: '#/components/schemas/ToolResultResourceReference'
            - type: 'null'
          description: 工具生成的稳定正式资源引用；访问 URL 必须通过对应资源接口按需获取
        error:
          type: [object, 'null']
          description: 工具失败或被拒绝时的错误信息
      description: 工具执行完成、失败或被 API 拒绝时发送的事件。

    ToolResultResourceReference:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [IMAGE, DOCUMENT]
          description: 正式资源类型
        id:
          type: string
          format: uuid
          description: 正式资源 ID

    TurnStreamCompletedEvent:
      type: object
      additionalProperties: false
      required: [type, seq, latencyMs, finishReason]
      properties:
        type:
          type: string
          const: completed
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        latencyMs:
          type: integer
          minimum: 0
          description: ai-service 报告的模型调用耗时，单位毫秒
        finishReason:
          type: [string, 'null']
          description: Provider 结束原因；length 表示回答可能被输出上限截断

    TurnErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: 稳定错误码
        message:
          type: string
          description: 可安全展示或记录的错误说明
        retryable:
          type: boolean
          description: 是否适合由用户主动重试

    TurnStreamErrorEvent:
      type: object
      additionalProperties: false
      required: [type, seq, error]
      properties:
        type:
          type: string
          const: error
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        error:
          type: object
          description: 终止本轮的错误信息，结构同 TurnErrorDetail

    TurnStreamEvent:
      oneOf:
        - $ref: '#/components/schemas/TurnStreamStartedEvent'
        - $ref: '#/components/schemas/TurnStreamStatusEvent'
        - $ref: '#/components/schemas/TurnStreamContentDeltaEvent'
        - $ref: '#/components/schemas/TurnStreamToolCallEvent'
        - $ref: '#/components/schemas/TurnStreamToolResultEvent'
        - $ref: '#/components/schemas/TurnStreamUsageEvent'
        - $ref: '#/components/schemas/TurnStreamCompletedEvent'
        - $ref: '#/components/schemas/TurnStreamErrorEvent'
      discriminator:
        propertyName: type
        mapping:
          started: '#/components/schemas/TurnStreamStartedEvent'
          status: '#/components/schemas/TurnStreamStatusEvent'
          content_delta: '#/components/schemas/TurnStreamContentDeltaEvent'
          tool_call: '#/components/schemas/TurnStreamToolCallEvent'
          tool_result: '#/components/schemas/TurnStreamToolResultEvent'
          usage: '#/components/schemas/TurnStreamUsageEvent'
          completed: '#/components/schemas/TurnStreamCompletedEvent'
          error: '#/components/schemas/TurnStreamErrorEvent'

    WorkReportType:
      type: string
      enum: [DAILY, WEEKLY]

    WorkReportStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]

    WorkReportReviewDecision:
      type: string
      enum: [APPROVED, REJECTED]

    WorkReportContent:
      type: object
      additionalProperties: false
      required: [completedItems, plannedItems, blockers, remarks]
      properties:
        completedItems:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 2000 }
        plannedItems:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 2000 }
        blockers:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 2000 }
        remarks: { type: [string, 'null'], maxLength: 5000 }

    CreateDailyWorkReportRequest:
      type: object
      additionalProperties: false
      required: [reportDate, reviewerMembershipId, content]
      properties:
        reportDate: { type: string, format: date }
        reviewerMembershipId: { type: string, format: uuid }
        content: { $ref: '#/components/schemas/WorkReportContent' }
        projectIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
        taskIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }

    CreateWeeklyWorkReportRequest:
      type: object
      additionalProperties: false
      required: [weekStartDate, reviewerMembershipId, content]
      properties:
        weekStartDate: { type: string, format: date, description: 必须是周一 }
        reviewerMembershipId: { type: string, format: uuid }
        content: { $ref: '#/components/schemas/WorkReportContent' }
        projectIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
        taskIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }

    UpdateWorkReportRequest:
      type: object
      additionalProperties: false
      required: [version, content, reviewerMembershipId, projectIds, taskIds]
      properties:
        version: { type: integer, minimum: 1 }
        reviewerMembershipId: { type: string, format: uuid }
        content: { $ref: '#/components/schemas/WorkReportContent' }
        projectIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
        taskIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }

    WorkReportVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }

    ReviewWorkReportRequest:
      type: object
      additionalProperties: false
      required: [decision, version]
      properties:
        decision: { $ref: '#/components/schemas/WorkReportReviewDecision' }
        comment: { type: [string, 'null'], maxLength: 5000 }
        version: { type: integer, minimum: 1 }

    WorkReportMemberIdentity:
      type: object
      required: [membershipId, account, displayName, departmentId]
      properties:
        membershipId: { type: string, format: uuid }
        account: { type: string }
        displayName: { type: string }
        departmentId: { type: [string, 'null'], format: uuid }

    WorkReport:
      type: object
      required: [id, type, periodStart, periodEnd, content, status, author, reviewer, projectIds, taskIds, submittedAt, reviewedAt, reviewComment, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/WorkReportType' }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        content: { $ref: '#/components/schemas/WorkReportContent' }
        status: { $ref: '#/components/schemas/WorkReportStatus' }
        author: { $ref: '#/components/schemas/WorkReportMemberIdentity' }
        reviewer:
          oneOf:
            - $ref: '#/components/schemas/WorkReportMemberIdentity'
            - type: 'null'
        projectIds:
          type: array
          items: { type: string, format: uuid }
        taskIds:
          type: array
          items: { type: string, format: uuid }
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewComment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    WorkReportList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkReport' }
        nextCursor: { type: [string, 'null'], format: uuid }

    WorkReportStatistics:
      type: object
      required: [total, draft, submitted, approved, rejected]
      properties:
        total: { type: integer, minimum: 0 }
        draft: { type: integer, minimum: 0 }
        submitted: { type: integer, minimum: 0 }
        approved: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }

    WorkReportResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/WorkReport' }
        requestId: { type: [string, 'null'] }

    WorkReportListResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/WorkReportList' }
        requestId: { type: [string, 'null'] }

    WorkReportStatisticsResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/WorkReportStatistics' }
        requestId: { type: [string, 'null'] }

    DashboardProjectMetrics:
      type: object
      additionalProperties: false
      required: [total, planning, active, paused, completed, cancelled, archived]
      properties:
        total: { type: integer, minimum: 0 }
        planning: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        paused: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }

    DashboardTaskMetrics:
      type: object
      additionalProperties: false
