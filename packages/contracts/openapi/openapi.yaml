  /images/{imageId}:
    get:
      summary: 获取 AI 生成图片的访问信息
      description: 返回当前租户内授权图片的元数据与短期访问 URL。
      operationId: getImage
      tags: [Image]
      security:
        - bearerAuth: []
      parameters:
        - name: imageId
          in: path
          required: true
          description: 图片资源 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 图片访问信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: 缺少 image.read 权限或图片不在授权范围内
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 图片不存在或已被删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /knowledge-bases:
    get:
      summary: 查询当前成员可访问的知识库
      description: 普通成员看到自己加入的知识库与归属范围覆盖自己的知识库（TENANT 全员、DEPARTMENT 部门树、PROJECT 项目），拥有 knowledge_base.read_all 或 knowledge_base.manage_all 权限的成员可看到当前租户全部知识库。
      operationId: listKnowledgeBases
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          description: 按知识库名称或说明模糊搜索
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          description: 每页数量，默认 20，最大 100
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: 上一页返回的知识库 ID
          schema: { type: string, format: uuid }
        - name: permission
          in: query
          required: false
          description: 只返回当前用户达到该成员权限的知识库（转存目标库选择）；省略时按可见范围返回
          schema: { $ref: '#/components/schemas/KnowledgeBaseMemberPermission' }
      responses:
        '200':
          description: 知识库列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeBaseListResponseEnvelope' }
        '400':
          description: 分页游标无效或请求参数校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

    post:
      summary: 创建知识库
      operationId: createKnowledgeBase
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKnowledgeBaseRequest' }
      responses:
        '201':
          description: 知识库已创建，创建者自动成为 MANAGER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeBaseResponseEnvelope' }
        '400':
          description: 请求字段校验失败或归属锚点无效（KNOWLEDGE_BASE_SCOPE_INVALID）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.create 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

  /knowledge-bases/{knowledgeBaseId}:
    parameters:
      - name: knowledgeBaseId
        in: path
        required: true
        description: 知识库 ID
        schema: { type: string, format: uuid }
    get:
      summary: 获取知识库详情
      operationId: getKnowledgeBase
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 知识库详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeBaseResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.read 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库不存在或当前成员无权访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

    patch:
      summary: 修改知识库
      description: 必须提交当前 version；修改成功后版本号递增。
      operationId: updateKnowledgeBase
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateKnowledgeBaseRequest' }
      responses:
        '200':
          description: 知识库已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeBaseResponseEnvelope' }
        '400':
          description: 请求字段校验失败、没有可修改字段或归属锚点无效（KNOWLEDGE_BASE_SCOPE_INVALID）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少知识库 MANAGER 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库不存在或当前成员无权访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '409':
          description: version 与服务端当前版本不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

    delete:
      summary: 删除知识库
      description: 软删除知识库，必须提交当前 version。
      operationId: deleteKnowledgeBase
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          description: 当前知识库版本
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: 知识库已软删除
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少知识库 MANAGER 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库不存在或当前成员无权访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '409':
          description: version 与服务端当前版本不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

  /knowledge-bases/{knowledgeBaseId}/query:
    parameters:
      - name: knowledgeBaseId
        in: path
        required: true
        description: 知识库 ID
        schema: { type: string, format: uuid }
    post:
      summary: 基于知识库内容回答提问
      description: |
        检索知识库内当前成员可见的文档内容，由 ai-service 基于证据生成带引用的答案。
        检索无结果时直接返回 insufficientEvidence=true 不调用模型；
        答案只引用真实检索到的 chunk，不允许模型编造文档、页码或链接。
      operationId: queryKnowledgeBase
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeQueryRequest' }
      responses:
        '200':
          description: 基于知识库证据的答案与引用列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeQueryResponseEnvelope' }
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.query 权限或不是该知识库成员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库不存在或当前成员无权访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '503':
          description: AI 服务暂不可用，可稍后重试
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

  /knowledge-bases/{knowledgeBaseId}/members:
    parameters:
      - name: knowledgeBaseId
        in: path
        required: true
        description: 知识库 ID
        schema: { type: string, format: uuid }
    get:
      summary: 查询知识库成员
      operationId: listKnowledgeBaseMembers
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: 上一页返回的成员关系 ID
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 知识库成员列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeBaseMemberListResponseEnvelope' }
        '400':
          description: 分页游标无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.read 权限或知识库 MANAGER 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库不存在或当前成员无权访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

    post:
      summary: 添加知识库成员
      description: membershipId 必须属于当前租户且对应的用户处于 ACTIVE 状态。
      operationId: addKnowledgeBaseMember
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKnowledgeBaseMemberRequest' }
      responses:
        '201':
          description: 知识库成员已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeBaseMemberResponseEnvelope' }
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.read 权限或知识库 MANAGER 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库或目标成员不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '409':
          description: 目标成员已经加入知识库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

  /knowledge-bases/{knowledgeBaseId}/documents:
    parameters:
      - name: knowledgeBaseId
        in: path
        required: true
        description: 知识库 ID
        schema: { type: string, format: uuid }
    get:
      summary: 查询知识库文档
      description: 返回知识库内未删除文档的分页列表，包含处理状态；普通成员只能查看自己加入的知识库，归属人群（TENANT/部门树/项目）可按只读浏览。
      operationId: listKnowledgeDocuments
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          description: 按文档名称模糊搜索
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          description: 每页数量，默认 20，最大 100
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: 上一页返回的文档 ID
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 知识库文档列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocumentListResponseEnvelope' }
        '400':
          description: 分页游标无效或请求参数校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.read 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库不存在或当前成员无权访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

    post:
      summary: 上传知识库文档
      description: 关联一个已上传的文件对象并创建文档，文档进入 PENDING 状态后由后台任务解析并建立索引。可见范围为 DEPARTMENT 时必须提供 departmentId，为 PROJECT 时必须提供 projectId。
      operationId: createKnowledgeDocument
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKnowledgeDocumentRequest' }
      responses:
        '201':
          description: 文档已创建，等待后台解析与索引
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocumentResponseEnvelope' }
        '400':
          description: 请求字段校验失败或可见范围与部门、项目字段不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.read 权限或知识库 EDITOR 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库不存在或文件对象不属于当前租户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '409':
          description: 文件对象已被其他文档使用或已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

  /knowledge-bases/{knowledgeBaseId}/documents/{documentId}/versions:
    parameters:
      - name: knowledgeBaseId
        in: path
        required: true
        description: 知识库 ID
        schema: { type: string, format: uuid }
      - name: documentId
        in: path
        required: true
        description: 文档 ID
        schema: { type: string, format: uuid }
    post:
      summary: 上传文档新版本
      description: 关联新的文件对象并创建文档新版本，文档重新进入 PENDING 状态并重建索引。
      operationId: createKnowledgeDocumentVersion
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKnowledgeDocumentVersionRequest' }
      responses:
        '201':
          description: 新版本已创建，文档重新进入处理队列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocumentResponseEnvelope' }
        '400':
          description: 请求字段校验失败或可见范围与部门、项目字段不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.read 权限或知识库 EDITOR 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库、文档不存在或文件对象不属于当前租户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '409':
          description: 文件对象已被其他文档使用或已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

  /knowledge-bases/{knowledgeBaseId}/documents/{documentId}/retry:
    parameters:
      - name: knowledgeBaseId
        in: path
        required: true
        description: 知识库 ID
        schema: { type: string, format: uuid }
      - name: documentId
        in: path
        required: true
        description: 文档 ID
        schema: { type: string, format: uuid }
    post:
      summary: 重试文档处理
      description: 将处理失败的文档重新放入 PENDING 队列，重置重试计数与失败原因。
      operationId: retryKnowledgeDocument
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 文档已重新进入处理队列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocumentResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.read 权限或知识库 EDITOR 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库或文档不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '409':
          description: 文档当前状态不允许重试
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

  /knowledge-bases/{knowledgeBaseId}/documents/{documentId}:
    parameters:
      - name: knowledgeBaseId
        in: path
        required: true
        description: 知识库 ID
        schema: { type: string, format: uuid }
      - name: documentId
        in: path
        required: true
        description: 文档 ID
        schema: { type: string, format: uuid }
    delete:
      summary: 删除知识库文档
      description: 软删除文档并异步清理全部版本的向量索引；库内 EDITOR 及以上（或 knowledge_base.manage_all）可执行。
      operationId: deleteKnowledgeDocument
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 文档已软删除
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.read 权限或知识库 EDITOR 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库或文档不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

  /dingtalk/integration:
    get:
      summary: 查询当前租户钉钉企业绑定
      operationId: getDingTalkIntegration
      tags: [DingTalk]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 钉钉企业绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DingTalkIntegrationResponseEnvelope' }
        '401': { description: 登录状态无效或已过期 }
        '403': { description: 缺少 dingtalk.integration.read 权限 }
        '404': { description: 当前租户尚未绑定钉钉企业 }
    post:
      summary: 创建当前租户钉钉企业绑定
      operationId: createDingTalkIntegration
      tags: [DingTalk]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDingTalkIntegrationRequest' }
      responses:
        '201':
          description: 钉钉企业绑定已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DingTalkIntegrationResponseEnvelope' }
        '400': { description: 请求字段校验失败 }
        '401': { description: 登录状态无效或已过期 }
        '403': { description: 缺少 dingtalk.integration.manage 权限 }
        '409': { description: 当前租户或钉钉企业已经存在绑定 }
    patch:
      summary: 修改当前租户钉钉企业绑定
      operationId: updateDingTalkIntegration
      tags: [DingTalk]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDingTalkIntegrationRequest' }
      responses:
        '200':
          description: 钉钉企业绑定已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DingTalkIntegrationResponseEnvelope' }
        '400': { description: 请求字段校验失败 }
        '401': { description: 登录状态无效或已过期 }
        '403': { description: 缺少 dingtalk.integration.manage 权限 }
        '404': { description: 当前租户尚未绑定钉钉企业 }
        '409': { description: version 与服务端当前版本不一致 }

  /dingtalk/integration/verify:
    post:
      summary: 验证当前租户钉钉应用凭证
      operationId: verifyDingTalkIntegration
      tags: [DingTalk]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 凭证验证成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DingTalkIntegrationResponseEnvelope' }
        '401': { description: 登录状态无效或已过期 }
        '403': { description: 缺少 dingtalk.integration.manage 权限 }
        '404': { description: 当前租户尚未绑定钉钉企业 }
        '502': { description: 钉钉开放平台凭证验证失败 }

  /dingtalk/organization/sync:
    post:
      summary: 同步钉钉组织架构和人员
      description: 全量拉取钉钉部门和人员并保存为当前租户的外部镜像；不会自动创建 CEES 登录账号。
      operationId: syncDingTalkOrganization
      tags: [DingTalk]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 同步完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DingTalkSyncJobResponseEnvelope' }
        '401': { description: 登录状态无效或已过期 }
        '403': { description: 缺少 dingtalk.organization.sync 权限 }
        '404': { description: 当前租户尚未绑定钉钉企业 }
        '409': { description: 当前集成已有同步任务运行中 }
        '502': { description: 钉钉开放平台同步失败 }

  /dingtalk/organization/snapshot:
    post:
      summary: 导入当前授权账号通过 DWS/MCP 获取的可见组织快照
      description: |
        仅 CEES 当前租户的 tenant_admin 可调用。服务端不检查授权账号是否为钉钉管理员，
        只将快照视为当前钉钉账号可见范围并执行幂等合并；未出现在快照中的既有镜像不会被标记删除或离职。
      operationId: importDingTalkVisibleOrganizationSnapshot
      tags: [DingTalk]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportDingTalkVisibleOrganizationSnapshotRequest' }
      responses:
        '200':
          description: 可见组织快照已合并
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DingTalkSyncJobResponseEnvelope' }
        '400': { description: 快照字段、部门层级或人员引用无效 }
        '401': { description: 登录状态无效或已过期 }
        '403': { description: 当前用户不是 CEES 租户管理员或缺少 dingtalk.organization.sync 权限 }
        '409': { description: 当前已有同步任务或快照所属钉钉企业与当前绑定冲突 }

  /dingtalk/organization/departments:
