openapi: 3.1.0
info:
  title: CEES AI API
  version: 0.22.0
  description: 以本文件为唯一事实源的公开 API 契约。资源与操作按 docs/api 约定补充。

servers:
  - url: http://localhost:3000/api/v1

paths:
  /health:
    get:
      summary: 健康检查
      operationId: health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /conversations:
    post:
      summary: 创建当前成员的私有 AI 会话
      description: |
        创建属于当前租户成员的私有会话。标题可省略，服务端在首轮完成后根据首条消息自动生成。
      operationId: createConversation
      tags: [Conversation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '200':
          description: 会话创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponseEnvelope'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

    get:
      summary: 查询当前成员的会话列表
      description: 按更新时间倒序返回当前成员的私有会话。
      operationId: listConversations
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页数量，默认 20，最大 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: 分页游标，上一页返回的 nextCursor
          schema:
            type: string
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponseEnvelope'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /conversations/{conversationId}:
    get:
      summary: 查询会话详情与最近消息
      description: |
        返回会话元数据与最近消息（按时间升序，最多 100 条）。只有会话所属成员可以访问。
      operationId: getConversation
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailResponseEnvelope'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话不存在或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

    patch:
      summary: 修改当前成员私有会话的标题
      description: 使用会话版本进行乐观并发控制；版本不匹配时返回 409。
      operationId: updateConversation
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: 返回修改后的会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponseEnvelope'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态或租户成员身份无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话不存在或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 会话版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
    delete:
      summary: 软删除当前成员的私有会话
      description: 删除只隐藏会话；消息、工具调用、事件和审计事实保留。存在运行中轮次时返回 409。
      operationId: deleteConversation
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: true
          description: 当前会话版本
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: 会话已软删除
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态或租户成员身份无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话不存在或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 会话版本冲突或仍有执行中的轮次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /conversations/{conversationId}/turns:
    post:
      summary: 发起一轮对话并以 SSE 流式返回事件
      description: |
        客户端只提交本轮 user 消息；历史消息与摘要由服务端加载并组装上下文。
        成功建立流后，每个 SSE `data` 字段都是一个 `TurnStreamEvent` JSON 对象，所有事件携带递增 `seq`。
        事件依次为 `started`、可选 `status`、零个或多个 `content_delta`、可选 `usage` 和 `completed`；流开始后的失败以 `error` 事件终止。
        客户端断开连接只解除订阅，不取消执行；重连后通过事件重放接口继续接收。
        重复提交同一 `Idempotency-Key` 时返回原 Turn 的事件流，不重新生成。
      operationId: createTurn
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: 客户端生成的幂等键；同一键重复提交返回原 Turn
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTurnRequest'
      responses:
        '200':
          description: 对话事件流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TurnStreamEvent'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话不存在或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 同一幂等键对应不同请求内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '422':
          description: 对话上下文不符合规则或超过预算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '502':
          description: AI Provider 返回了无效结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '503':
          description: ai-service、对话模式或模型暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /conversations/{conversationId}/turns/{turnId}/events:
    get:
      summary: 以 SSE 重放并继续接收轮次事件
      description: |
        客户端携带已收到的最后事件序号 `afterSeq` 重新订阅；服务端先重放该序号之后的已持久化事件，
        再继续实时推送后续事件直到轮次终态。轮次已结束时，重放全部剩余事件后正常结束。
      operationId: replayTurnEvents
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
        - name: turnId
          in: path
          required: true
          description: 轮次 ID
          schema:
            type: string
            format: uuid
        - name: afterSeq
          in: query
          required: false
          description: 已收到的最后事件序号；省略时从首个事件开始重放
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 轮次事件流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TurnStreamEvent'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话或轮次不存在，或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /conversations/{conversationId}/turns/{turnId}/cancel:
    post:
      summary: 取消正在执行的轮次
      description: |
        取消是显式动作，不是断线副作用。仅 RUNNING 状态的轮次可取消；
        取消后服务端尽力停止后续模型调用，已写入的正式业务数据不回滚。
      operationId: cancelTurn
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
        - name: turnId
          in: path
          required: true
          description: 轮次 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 轮次已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponseEnvelope'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话或轮次不存在，或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 轮次已结束，不能取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /auth/login:
    post:
      summary: 使用租户编码、账号和密码登录
      operationId: authLogin
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录凭证无效或账户不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/refresh:
    post:
      summary: 使用 Refresh Token 轮换访问令牌和刷新令牌
      operationId: authRefresh
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 令牌轮换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: Refresh Token 无效、过期或已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/activate:
    post:
      summary: 使用一次性激活令牌设置租户账号密码
      operationId: authActivate
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTenantInvitationRequest"
      responses:
        '200':
          description: 租户账号激活成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitationAcceptanceResponseEnvelope"
        '401':
          description: 激活令牌无效、过期或已使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/logout:
    post:
      summary: 撤销当前登录会话
      operationId: authLogout
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 当前会话已撤销
        "401":
          description: Access Token 无效或 Session 已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/me:
    get:
      summary: 获取当前用户、租户、角色和权限
      operationId: authMe
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前认证上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponseEnvelope"
        "401":
          description: Access Token 无效或 Session 已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/change-password:
    post:
      summary: 修改当前租户成员密码
      operationId: authChangePassword
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 密码修改成功，其他租户会话已撤销
        "400":
          description: 请求字段校验失败或新旧密码相同
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效、已过期或当前密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /users/me/profile:
    get:
      summary: 获取当前租户内的个人资料
      operationId: userProfileGetCurrent
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户在当前租户内的个人资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    patch:
      summary: 修改当前租户内的个人资料
      operationId: userProfileUpdateCurrent
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
      responses:
        "200":
          description: 修改后的个人资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 个人资料版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current:
    get:
      summary: 获取当前租户
      operationId: tenantGetCurrent
      tags:
        - Tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 tenant.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    patch:
      summary: 修改当前租户
      operationId: tenantUpdateCurrent
      tags:
        - Tenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: 修改后的租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 tenant.update 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current/departments:
    get:
      summary: 查询当前租户部门树
      operationId: departmentListTree
      tags:
        - Organization
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DepartmentStatus'
      responses:
        '200':
          description: 当前租户部门树
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentTreeResponseEnvelope'
        '401':
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: 缺少 department.read 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
    post:
      summary: 创建当前租户部门
      operationId: departmentCreate
      tags:
        - Organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '201':
          description: 已创建部门
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponseEnvelope'
        '400':
          description: 请求字段或部门层级无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: 缺少 department.create 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 父部门不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 同级部门名称冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /tenants/current/organization-imports/validate:
    post:
      summary: 校验组织架构和成员批量导入数据
      description: 不写入正式业务数据，返回部门复用或创建预览、成员有效角色及逐项校验问题。
      operationId: organizationImportValidate
      tags:
        - Organization
      security:
