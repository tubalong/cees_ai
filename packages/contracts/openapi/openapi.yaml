      description: >-
        由生成时落库的结构化 DocumentSpec 经 ai-service 确定性渲染为 DOCX 文件，
        不调用 LLM；复用 document.read 权限，导出是文档资源的另一种交付视图而非独立资源。
      operationId: documentExportDocx
      tags: [Document]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: DOCX 文档文件
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              description: 附件文件名，含 ASCII 回退与 RFC 5987 UTF-8 文件名
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "400":
          description: 文档没有可导出的生成规格
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
