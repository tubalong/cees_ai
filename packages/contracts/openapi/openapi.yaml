            application/json:
              schema:
                $ref: "#/components/schemas/AICreditBillingConfigResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 平台权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 乐观锁版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AssignmentPolicyDomain:
      type: string
      enum: [TASK, MEETING, WORK_REPORT, PROJECT, DOCUMENT]
      description: 分配策略适用的业务领域

    AssignmentPolicyLevel:
      type: string
      enum: [TENANT, PROJECT]
      description: 策略层级；TENANT 为租户默认，PROJECT 为项目覆盖

    AssignmentPolicyFallbackMode:
      type: string
      enum: [NONE, PROJECT_MEMBERS, TENANT_MEMBERS]
      description: 候选池不可用时的兜底范围

    AssignmentCandidatePool:
      type: object
      additionalProperties: false
      required: [membershipIds, departmentIds, projectIds]
      properties:
        membershipIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        departmentIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        projectIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }

    AssignmentPolicy:
      type: object
      required:
        - id
        - tenantId
        - domain
        - level
        - name
        - candidatePool
        - skipOnLeave
        - fallbackMode
        - enabled
        - version
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        domain: { $ref: '#/components/schemas/AssignmentPolicyDomain' }
        level: { $ref: '#/components/schemas/AssignmentPolicyLevel' }
        projectId: { type: [string, 'null'], format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        candidatePool: { $ref: '#/components/schemas/AssignmentCandidatePool' }
        skipOnLeave: { type: boolean }
        fallbackMode: { $ref: '#/components/schemas/AssignmentPolicyFallbackMode' }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdBy: { type: [string, 'null'], format: uuid }
        updatedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AssignmentPolicyList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssignmentPolicy' }
        nextCursor: { type: [string, 'null'], format: uuid }

    CreateAssignmentPolicyRequest:
      type: object
      additionalProperties: false
      required: [domain, level, name, candidatePool, skipOnLeave, fallbackMode]
      properties:
        domain: { $ref: '#/components/schemas/AssignmentPolicyDomain' }
        level: { $ref: '#/components/schemas/AssignmentPolicyLevel' }
        projectId: { type: [string, 'null'], format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        candidatePool: { $ref: '#/components/schemas/AssignmentCandidatePool' }
        skipOnLeave: { type: boolean }
        fallbackMode: { $ref: '#/components/schemas/AssignmentPolicyFallbackMode' }
        enabled: { type: boolean, default: true }

    UpdateAssignmentPolicyRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        candidatePool: { $ref: '#/components/schemas/AssignmentCandidatePool' }
        skipOnLeave: { type: boolean }
        fallbackMode: { $ref: '#/components/schemas/AssignmentPolicyFallbackMode' }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }

    AssignmentPolicyResolveContext:
      type: object
      additionalProperties: false
      required: [sourceType, sourceId]
      properties:
        sourceType: { type: string, minLength: 1, maxLength: 64 }
        sourceId: { type: string, format: uuid }

    AssignmentPolicyAvailabilityWindow:
      type: object
      additionalProperties: false
      required: [startAt, endAt]
      properties:
        startAt: { type: string, format: date-time, description: 候选人需要保持可用的开始时间 }
        endAt: { type: string, format: date-time, description: 候选人需要保持可用的结束时间，必须晚于 startAt }

    AssignmentPolicyResolveRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: { $ref: '#/components/schemas/AssignmentPolicyDomain' }
        projectId: { type: [string, 'null'], format: uuid }
        context: { $ref: '#/components/schemas/AssignmentPolicyResolveContext' }
        availabilityWindow: { $ref: '#/components/schemas/AssignmentPolicyAvailabilityWindow' }

    AssignmentPolicySourceTrace:
      type: object
      required: [policyId, projectId, domain, level]
      properties:
        policyId: { type: [string, 'null'], format: uuid }
        projectId: { type: [string, 'null'], format: uuid }
        domain: { $ref: '#/components/schemas/AssignmentPolicyDomain' }
        level: { $ref: '#/components/schemas/AssignmentPolicyLevel' }

    AssignmentPolicyResolveResult:
      type: object
      required:
        - matchedPolicyId
        - domain
        - level
        - candidates
        - skippedOnLeave
        - leaveFilterApplied
        - fallbackMode
        - sourceTrace
        - resolvedAt
      properties:
        matchedPolicyId: { type: [string, 'null'], format: uuid }
        domain: { $ref: '#/components/schemas/AssignmentPolicyDomain' }
        level: { $ref: '#/components/schemas/AssignmentPolicyLevel' }
        candidates:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        skippedOnLeave:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        leaveFilterApplied: { type: boolean, description: 是否实际使用 availabilityWindow 查询并过滤已批准请假 }
        fallbackMode: { $ref: '#/components/schemas/AssignmentPolicyFallbackMode' }
        sourceTrace: { $ref: '#/components/schemas/AssignmentPolicySourceTrace' }
        resolvedAt: { type: string, format: date-time }

    HrProfileStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, TERMINATED, ON_LEAVE]

    HrProfile:
      type: object
      description: 员工档案。phone、email、idType、idNumber、emergencyContactName、emergencyContactPhone 为敏感字段；缺少 hr.profile.sensitive.read 时返回脱敏值或 null。
      required:
        - id
        - tenantId
        - membershipId
        - displayName
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        employeeNo: { type: [string, 'null'], maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        departmentId: { type: [string, 'null'], format: uuid }
        position: { type: [string, 'null'], maxLength: 120 }
        employmentType: { type: [string, 'null'], maxLength: 32 }
        managerMembershipId: { type: [string, 'null'], format: uuid }
        entryDate: { type: [string, 'null'], format: date }
        leaveDate: { type: [string, 'null'], format: date, description: 离职日期，由离职或解除人事异动写入 }
        phone: { type: [string, 'null'], maxLength: 64, description: 敏感字段；无 hr.profile.sensitive.read 时返回脱敏值 }
        email: { type: [string, 'null'], maxLength: 120, description: 敏感字段；无 hr.profile.sensitive.read 时返回脱敏值 }
        idType: { type: [string, 'null'], maxLength: 32, description: 敏感字段；无 hr.profile.sensitive.read 时返回脱敏值 }
        idNumber: { type: [string, 'null'], maxLength: 64, description: 敏感字段；无 hr.profile.sensitive.read 时返回脱敏值 }
        emergencyContactName: { type: [string, 'null'], maxLength: 120, description: 敏感字段；无 hr.profile.sensitive.read 时返回脱敏值 }
        emergencyContactPhone: { type: [string, 'null'], maxLength: 64, description: 敏感字段；无 hr.profile.sensitive.read 时返回脱敏值 }
        educationLevel: { type: [string, 'null'], maxLength: 64 }
        costCenter: { type: [string, 'null'], maxLength: 64 }
        jobLevel: { type: [string, 'null'], maxLength: 64 }
        probationEndDate: { type: [string, 'null'], format: date }
        regularDate: { type: [string, 'null'], format: date }
        workLocation: { type: [string, 'null'], maxLength: 160 }
        status: { $ref: '#/components/schemas/HrProfileStatus' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HrProfileList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HrProfile' }
        nextCursor: { type: [string, 'null'], format: uuid }

    CreateHrProfileRequest:
      type: object
      description: 创建员工档案。提交任一敏感字段需要 hr.profile.sensitive.manage 权限。
      additionalProperties: false
      required: [membershipId]
      properties:
        membershipId: { type: string, format: uuid }
        employeeNo: { type: [string, 'null'], maxLength: 64 }
        departmentId: { type: [string, 'null'], format: uuid }
        position: { type: [string, 'null'], maxLength: 120 }
        employmentType: { type: [string, 'null'], maxLength: 32 }
        managerMembershipId: { type: [string, 'null'], format: uuid }
        entryDate: { type: [string, 'null'], format: date }
        leaveDate: { type: [string, 'null'], format: date, description: 仅由人事异动写入；请求中携带时返回 400 HR_PROFILE_LEAVE_DATE_REQUIRES_CHANGE }
        phone: { type: [string, 'null'], maxLength: 64 }
        email: { type: [string, 'null'], maxLength: 120 }
        idType: { type: [string, 'null'], maxLength: 32 }
        idNumber: { type: [string, 'null'], maxLength: 64 }
        emergencyContactName: { type: [string, 'null'], maxLength: 120 }
        emergencyContactPhone: { type: [string, 'null'], maxLength: 64 }
        educationLevel: { type: [string, 'null'], maxLength: 64 }
        costCenter: { type: [string, 'null'], maxLength: 64 }
        jobLevel: { type: [string, 'null'], maxLength: 64 }
        probationEndDate: { type: [string, 'null'], format: date }
        regularDate: { type: [string, 'null'], format: date }
        workLocation: { type: [string, 'null'], maxLength: 160 }
    UpdateHrProfileRequest:
      type: object
      description: 修改员工档案。提交任一敏感字段需要 hr.profile.sensitive.manage 权限；客户端不得将服务端返回的脱敏值回写。
      additionalProperties: false
      required: [version]
      properties:
        employeeNo: { type: [string, 'null'], maxLength: 64 }
        departmentId: { type: [string, 'null'], format: uuid }
        position: { type: [string, 'null'], maxLength: 120 }
        employmentType: { type: [string, 'null'], maxLength: 32 }
        managerMembershipId: { type: [string, 'null'], format: uuid }
        entryDate: { type: [string, 'null'], format: date }
        leaveDate: { type: [string, 'null'], format: date, description: 仅由人事异动写入；请求中携带时返回 400 HR_PROFILE_LEAVE_DATE_REQUIRES_CHANGE }
        phone: { type: [string, 'null'], maxLength: 64 }
        email: { type: [string, 'null'], maxLength: 120 }
        idType: { type: [string, 'null'], maxLength: 32 }
        idNumber: { type: [string, 'null'], maxLength: 64 }
        emergencyContactName: { type: [string, 'null'], maxLength: 120 }
        emergencyContactPhone: { type: [string, 'null'], maxLength: 64 }
        educationLevel: { type: [string, 'null'], maxLength: 64 }
        costCenter: { type: [string, 'null'], maxLength: 64 }
        jobLevel: { type: [string, 'null'], maxLength: 64 }
        probationEndDate: { type: [string, 'null'], format: date }
        regularDate: { type: [string, 'null'], format: date }
        workLocation: { type: [string, 'null'], maxLength: 160 }
        status: { allOf: [{ $ref: '#/components/schemas/HrProfileStatus' }], description: 不能设置为 TERMINATED（返回 400 HR_PROFILE_TERMINATION_REQUIRES_CHANGE）；离职与解除必须通过人事异动审批 }
        version: { type: integer, minimum: 1 }

    HrLeaveUnit:
      type: string
      enum: [DAY, HALF_DAY, HOUR]

    HrLeaveType:
      type: object
      required:
        - id
        - tenantId
        - code
        - name
        - unit
        - paid
        - enabled
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 120 }
        unit: { $ref: '#/components/schemas/HrLeaveUnit' }
        paid: { type: boolean }
        defaultDays: { type: [number, 'null'], minimum: 0 }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HrLeaveTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HrLeaveType' }

    CreateHrLeaveTypeRequest:
      type: object
      additionalProperties: false
      required: [code, name, unit, paid]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 120 }
        unit: { $ref: '#/components/schemas/HrLeaveUnit' }
        paid: { type: boolean }
        defaultDays: { type: [number, 'null'], minimum: 0 }
        enabled: { type: boolean, default: true }

    HrLeaveBalance:
      type: object
      required:
        - id
        - tenantId
        - membershipId
        - leaveTypeId
        - year
        - totalDays
        - usedDays
        - pendingDays
        - remainingDays
        - unit
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        year: { type: integer, minimum: 2024, maximum: 2100 }
        totalDays: { type: number, minimum: 0 }
        usedDays: { type: number, minimum: 0 }
        pendingDays: { type: number, minimum: 0 }
        remainingDays: { type: number, minimum: 0 }
        unit: { $ref: '#/components/schemas/HrLeaveUnit' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HrLeaveBalanceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HrLeaveBalance' }
        nextCursor: { type: [string, 'null'], format: uuid }

    HrLeaveRequestStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED]

    HrLeaveRequest:
      type: object
      description: 请假申请。durationDays 由服务端按申请时间与假期单位折算，yearAllocations 为按租户本地年度拆分的额度占用明细。
      required:
        - id
        - tenantId
        - membershipId
        - leaveTypeId
        - startAt
        - endAt
        - durationDays
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        durationDays: { type: number, minimum: 0 }
        yearAllocations:
          type: array
          items: { $ref: '#/components/schemas/HrLeaveYearAllocation' }
          description: 按租户本地年度拆分的额度占用；跨年度申请会占用多个年度余额
        reason: { type: [string, 'null'], maxLength: 2000 }
        status: { $ref: '#/components/schemas/HrLeaveRequestStatus' }
        reviewedBy: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewComment: { type: [string, 'null'], maxLength: 2000 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HrLeaveRequestList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HrLeaveRequest' }
        nextCursor: { type: [string, 'null'], format: uuid }

    CreateHrLeaveRequestRequest:
      type: object
      description: 创建请假申请。durationDays 为可选一致性校验值，服务端按申请时间与假期单位折算后以服务端结果为准。
      additionalProperties: false
      required: [leaveTypeId, startAt, endAt]
      properties:
        leaveTypeId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        durationDays: { type: number, minimum: 0, description: 可选；与服务端折算结果不一致时返回 400 HR_LEAVE_DURATION_MISMATCH }
        reason: { type: [string, 'null'], maxLength: 2000 }

    HrLeaveYearAllocation:
      type: object
      required: [year, days]
      properties:
        year: { type: integer, minimum: 2000, maximum: 2100 }
        days: { type: number, minimum: 0 }

    ReviewHrLeaveRequestRequest:
      type: object
      additionalProperties: false
      required: [decision, version]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        comment: { type: [string, 'null'], maxLength: 2000 }
        version: { type: integer, minimum: 1 }
    UpdateHrLeaveTypeRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 120 }
        unit: { $ref: '#/components/schemas/HrLeaveUnit' }
        paid: { type: boolean }
        defaultDays: { type: [number, 'null'], minimum: 0 }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }

    AdjustHrLeaveBalanceRequest:
      type: object
      additionalProperties: false
      required: [membershipId, leaveTypeId, year, deltaDays, reason]
      properties:
        membershipId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        year: { type: integer, minimum: 2024, maximum: 2100 }
        deltaDays: { type: number }
        reason: { type: string, minLength: 1, maxLength: 500 }

    CancelHrLeaveRequestRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: [string, 'null'], maxLength: 500 }

    WithdrawHrLeaveRequestRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }

    HrAttendanceStatus:
      type: string
      enum: [NORMAL, LATE, EARLY_LEAVE, ABSENT, LEAVE, OVERTIME, EXCEPTION, CORRECTED]

    HrAttendanceRecord:
      type: object
      required:
        - id
        - tenantId
        - membershipId
        - workDate
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        workDate: { type: string, format: date }
        checkInAt: { type: [string, 'null'], format: date-time }
        checkOutAt: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/HrAttendanceStatus' }
        source: { type: string, enum: [MANUAL, IMPORT, DINGTALK] }
        note: { type: [string, 'null'], maxLength: 1000 }
        reviewedBy: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HrAttendanceRecordList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HrAttendanceRecord' }
        nextCursor: { type: [string, 'null'], format: uuid }

    CreateHrAttendanceRecordRequest:
      type: object
      additionalProperties: false
      required: [membershipId, workDate, status]
      properties:
        membershipId: { type: string, format: uuid }
        workDate: { type: string, format: date }
        checkInAt: { type: [string, 'null'], format: date-time }
        checkOutAt: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/HrAttendanceStatus' }
        note: { type: [string, 'null'], maxLength: 1000 }

    UpdateHrAttendanceRecordRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        checkInAt: { type: [string, 'null'], format: date-time }
        checkOutAt: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/HrAttendanceStatus' }
        note: { type: [string, 'null'], maxLength: 1000 }
        version: { type: integer, minimum: 1 }

    ReviewHrAttendanceRecordRequest:
      type: object
      additionalProperties: false
      required: [decision, version]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        comment: { type: [string, 'null'], maxLength: 500 }
        version: { type: integer, minimum: 1 }

    ImportHrAttendanceRecordsRequest:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateHrAttendanceRecordRequest' }

    HrAttendanceImportResult:
      type: object
      required: [total, imported, failed, failures]
      properties:
        total: { type: integer, minimum: 0 }
        imported: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        failures:
          type: array
          items:
            type: object
            required: [index, code, message]
            properties:
              index: { type: integer, minimum: 0 }
              code: { type: string }
              message: { type: string }

    HrOvertimeRequestStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED]

    HrOvertimeRequest:
      type: object
      required:
        - id
        - tenantId
        - membershipId
        - startAt
        - endAt
        - durationHours
        - reason
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        durationHours: { type: number, minimum: 0.01, description: 客户端一致性校验值；正式时长由服务端按起止时间折算 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        status: { $ref: '#/components/schemas/HrOvertimeRequestStatus' }
        reviewedBy: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewComment: { type: [string, 'null'], maxLength: 500 }
