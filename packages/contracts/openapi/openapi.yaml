        "403":
          description: 平台权限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 同一能力 × 模型组 × 计量维度已存在费率行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

