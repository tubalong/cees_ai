  /projects/{projectId}/tasks/{taskId}/activities:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: 查询任务操作动态
      operationId: taskActivityList
      tags: [Task]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 任务操作动态列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActivityListResponseEnvelope' }
        '403': { description: 缺少 task.read 权限, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '404': { description: 项目或任务不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, BLOCKED, DONE, CANCELLED]

    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]

    TaskAssigneeType:
      type: string
      enum: [OWNER, COLLABORATOR]

    TaskTransitionTarget:
      type: string
      enum: [IN_PROGRESS, BLOCKED, DONE, CANCELLED]

    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, ownerMembershipId]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 10000, default: null }
        parentId: { type: [string, 'null'], format: uuid, default: null }
        priority:
          allOf:
            - $ref: '#/components/schemas/TaskPriority'
          default: MEDIUM
        dueDate: { type: [string, 'null'], format: date-time, default: null }
        ownerMembershipId: { type: string, format: uuid }
        collaboratorMembershipIds:
          type: array
          maxItems: 100
          uniqueItems: true
          default: []
          items: { type: string, format: uuid }

    UpdateTaskRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 10000 }
        parentId: { type: [string, 'null'], format: uuid }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueDate: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }

    TaskTransitionRequest:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { $ref: '#/components/schemas/TaskTransitionTarget' }
        reason:
          type: [string, 'null']
          maxLength: 500
          description: BLOCKED 和 CANCELLED 时必填
        version: { type: integer, minimum: 1 }

    ReplaceTaskAssigneesRequest:
      type: object
      additionalProperties: false
      required: [ownerMembershipId, collaboratorMembershipIds, version]
      properties:
        ownerMembershipId: { type: string, format: uuid }
        collaboratorMembershipIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }

    TaskMemberIdentity:
      type: object
      required: [membershipId, account, displayName, departmentId]
      properties:
        membershipId: { type: string, format: uuid }
        account: { type: string }
        displayName: { type: string }
        departmentId: { type: [string, 'null'], format: uuid }

    TaskAssignee:
      allOf:
        - $ref: '#/components/schemas/TaskMemberIdentity'
        - type: object
          required: [type]
          properties:
            type: { $ref: '#/components/schemas/TaskAssigneeType' }

    TaskSummary:
      type: object
      required:
        - id
        - projectId
        - parentId
        - title
        - description
        - status
        - priority
        - dueDate
        - owner
        - collaborators
        - subtaskCount
        - commentCount
        - attachmentCount
        - createdAt
        - updatedAt
        - version
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueDate: { type: [string, 'null'], format: date-time }
        owner:
          oneOf:
            - $ref: '#/components/schemas/TaskAssignee'
            - type: 'null'
        collaborators:
          type: array
          items: { $ref: '#/components/schemas/TaskAssignee' }
        subtaskCount: { type: integer, minimum: 0 }
        commentCount: { type: integer, minimum: 0 }
        attachmentCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    TaskList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
        nextCursor: { type: [string, 'null'], format: uuid }

    TaskResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/TaskSummary' }
        requestId: { type: [string, 'null'] }

    TaskListResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/TaskList' }
        requestId: { type: [string, 'null'] }

    CreateTaskCommentRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }

    UpdateTaskCommentRequest:
      type: object
      additionalProperties: false
      required: [content, version]
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }
        version: { type: integer, minimum: 1 }

    TaskComment:
      type: object
      required: [id, taskId, content, author, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        content: { type: string }
        author: { $ref: '#/components/schemas/TaskMemberIdentity' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    TaskCommentList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskComment' }
        nextCursor: { type: [string, 'null'], format: uuid }

    TaskCommentResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/TaskComment' }
        requestId: { type: [string, 'null'] }

    TaskCommentListResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/TaskCommentList' }
        requestId: { type: [string, 'null'] }

    AddTaskAttachmentRequest:
      type: object
      additionalProperties: false
      required: [fileObjectId]
      properties:
        fileObjectId: { type: string, format: uuid }

    TaskAttachment:
      type: object
      required: [id, taskId, fileObjectId, fileName, contentType, sizeBytes, createdByMembershipId, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        fileObjectId: { type: string, format: uuid }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        createdByMembershipId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    TaskAttachmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskAttachment' }

    TaskAttachmentResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/TaskAttachment' }
        requestId: { type: [string, 'null'] }

    TaskAttachmentListResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/TaskAttachmentList' }
        requestId: { type: [string, 'null'] }

    TaskActivity:
      type: object
      required: [id, taskId, action, actor, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        action: { type: string }
        actor:
          oneOf:
            - $ref: '#/components/schemas/TaskMemberIdentity'
            - type: 'null'
        metadata:
          type: [object, 'null']
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    TaskActivityList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskActivity' }
        nextCursor: { type: [string, 'null'], format: uuid }

    TaskActivityListResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/TaskActivityList' }
        requestId: { type: [string, 'null'] }

    ProjectStatus:
      type: string
      enum: [PLANNING, ACTIVE, PAUSED, COMPLETED, CANCELLED, ARCHIVED]

    ProjectMemberRole:
      type: string
      enum: [OWNER, MANAGER, MEMBER]

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          minLength: 2
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 2000
        departmentId:
          type: [string, 'null']
          format: uuid
        ownerMembershipId:
          type: string
          format: uuid
          description: 不传时默认当前租户成员；指定其他成员需要 project.manage_all
        startsAt:
          type: [string, 'null']
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time

    UpdateProjectRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          minLength: 2
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 2000
        departmentId:
          type: [string, 'null']
          format: uuid
        startsAt:
          type: [string, 'null']
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          minimum: 1

    ProjectVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1

    ProjectReasonRequest:
      type: object
      additionalProperties: false
      required: [reason, version]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        version:
          type: integer
          minimum: 1

    CompleteProjectRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        completionSummary:
          type: [string, 'null']
          maxLength: 2000
        version:
          type: integer
          minimum: 1

    TransferProjectOwnerRequest:
      type: object
      additionalProperties: false
      required: [membershipId, version]
      properties:
        membershipId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1

    AddProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [membershipId]
      properties:
        membershipId:
          type: string
          format: uuid
        role:
          type: string
          enum: [MANAGER, MEMBER]
          default: MEMBER

    UpdateProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [role, version]
      properties:
        role:
          type: string
          enum: [MANAGER, MEMBER]
        version:
          type: integer
          minimum: 1

    ProjectMemberSummary:
      type: object
      required: [id, membershipId, account, displayName, role, joinedAt, version]
      properties:
        id: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        account: { type: string }
        displayName: { type: string }
        departmentId:
          type: [string, 'null']
          format: uuid
        role: { $ref: '#/components/schemas/ProjectMemberRole' }
        joinedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    ProjectSummary:
      type: object
      required:
        - id
        - code
        - name
        - status
        - owner
        - currentMemberRole
        - memberCount
        - taskCount
        - createdAt
        - updatedAt
        - version
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        departmentId:
          type: [string, 'null']
          format: uuid
        owner:
          oneOf:
            - $ref: '#/components/schemas/ProjectMemberSummary'
            - type: 'null'
          description: 仅无法推断负责人的迁移旧数据可能为空；新项目始终存在负责人
        currentMemberRole:
          oneOf:
            - $ref: '#/components/schemas/ProjectMemberRole'
            - type: 'null'
          description: project.manage_all 跨项目访问时可能为空
        startsAt:
          type: [string, 'null']
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        completedByMembershipId:
          type: [string, 'null']
          format: uuid
        completionSummary: { type: [string, 'null'] }
        memberCount: { type: integer, minimum: 0 }
        taskCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    ProjectList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectSummary' }
        nextCursor:
          type: [string, 'null']
          format: uuid

    ProjectMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectMemberSummary' }

    TenantStatus:
      type: string
      enum:
        - PENDING_ACTIVATION
        - ACTIVE
        - SUSPENDED

    PlatformRole:
      type: string
      enum:
        - SUPER_ADMIN

    PlatformLoginRequest:
      type: object
      additionalProperties: false
      required:
        - account
        - password
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        deviceName:
          type: string
          minLength: 1
          maxLength: 100

    PlatformAdministratorIdentity:
      type: object
      required:
        - id
        - account
        - user
        - role
        - permissions
      properties:
        id:
          type: string
          format: uuid
        account:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
        role:
          $ref: "#/components/schemas/PlatformRole"
        permissions:
          type: array
          items:
            type: string

    PlatformLoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPairResponse"
        - type: object
          required:
            - administrator
          properties:
            administrator:
              $ref: "#/components/schemas/PlatformAdministratorIdentity"

    PlatformMeResponse:
      type: object
      required:
        - administrator
      properties:
        administrator:
          $ref: "#/components/schemas/PlatformAdministratorIdentity"

    InitialTenantAdministratorRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 120

    CreatePlatformTenantRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - initialAdministrator
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        name:
          type: string
          minLength: 1
          maxLength: 120
        initialAdministrator:
          $ref: "#/components/schemas/InitialTenantAdministratorRequest"

    UpdatePlatformTenantRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        version:
          type: integer
          minimum: 1

    SuspendPlatformTenantRequest:
      type: object
      additionalProperties: false
      required:
        - reason
        - version
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        version:
          type: integer
          minimum: 1

    VersionRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1

    AssignPlatformTenantAdministratorRequest:
      type: object
      additionalProperties: false
      required:
        - account
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 120

    PlatformTenantDetail:
      type: object
      required:
        - id
        - code
        - name
        - status
        - activeAdministratorCount
        - pendingInvitationCount
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        activeAdministratorCount:
          type: integer
          minimum: 0
        pendingInvitationCount:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlatformTenantList:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformTenantDetail"
        nextCursor:
          type: [string, "null"]
          format: uuid

    PlatformTenantAdministrator:
      type: object
      required:
        - membershipId
        - account
        - user
        - status
        - joinedAt
      properties:
        membershipId:
          type: string
          format: uuid
        account:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
        status:
          $ref: "#/components/schemas/MemberStatus"
        joinedAt:
          type: string
          format: date-time

    PlatformTenantAdministratorList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformTenantAdministrator"

    TenantAdministratorAssignmentStatus:
      type: string
      enum:
        - ASSIGNED
        - INVITED

    PlatformTenantAdministratorAssignment:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/TenantAdministratorAssignmentStatus"
        administrator:
          $ref: "#/components/schemas/PlatformTenantAdministrator"
        invitation:
          $ref: "#/components/schemas/TenantInvitation"
        invitationToken:
          type: string
          minLength: 32

    PlatformTenantProvisioningResponse:
      type: object
      required:
        - tenant
        - administratorAssignment
      properties:
        tenant:
          $ref: "#/components/schemas/PlatformTenantDetail"
        administratorAssignment:
          $ref: "#/components/schemas/PlatformTenantAdministratorAssignment"

    TenantInvitationStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - REVOKED
        - EXPIRED

    TenantInvitation:
      type: object
      required:
        - id
        - tenantId
        - account
        - status
        - isInitialAdministrator
        - roleIds
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        account:
          type: string
        displayName:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/TenantInvitationStatus"
        isInitialAdministrator:
          type: boolean
        roleIds:
          type: array
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    TenantInvitationCreated:
      type: object
      required:
        - invitation
        - invitationToken
      properties:
        invitation:
          $ref: "#/components/schemas/TenantInvitation"
        invitationToken:
          type: string
          minLength: 32

    TenantInvitationList:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantInvitation"
        nextCursor:
          type: [string, "null"]
          format: uuid

    CreateTenantInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
        - roleIds
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        roleIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            format: uuid

    AcceptTenantInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - tenantCode
        - account
        - invitationToken
        - password
      properties:
        tenantCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        account:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9]+$
        invitationToken:
          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    TenantInvitationAcceptance:
      type: object
      required:
        - tenant
        - membership
      properties:
        tenant:
          $ref: "#/components/schemas/AuthTenant"
        membership:
          $ref: "#/components/schemas/TenantMember"

    PlatformAuditEvent:
      type: object
      required:
        - id
        - action
        - outcome
        - resourceType
        - requestId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        actorUserId:
          type: [string, "null"]
          format: uuid
        actorPlatformAdministratorId:
          type: [string, "null"]
          format: uuid
        resourceType:
          type: string
        resourceId:
          type: [string, "null"]
          format: uuid
        requestId:
          type: string
        ipAddress:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
        metadata:
          type: [object, "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    PlatformAuditEventList:
      type: object
      required:
        - items
        - nextCursor
