    DashboardUpcomingMeetingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DashboardUpcomingMeeting' }

    DashboardOverviewResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/DashboardOverview' }
        requestId: { type: [string, 'null'] }

    DashboardTaskStatisticsResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/DashboardTaskStatistics' }
        requestId: { type: [string, 'null'] }

    DashboardTodoListResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/DashboardTodoList' }
        requestId: { type: [string, 'null'] }

    DashboardUpcomingMeetingListResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/DashboardUpcomingMeetingList' }
        requestId: { type: [string, 'null'] }

    NotificationResult:
      type: object
      additionalProperties: false
      required: [id, title, content, channel, relationType, relationId, readAt, createdAt]
      properties:
        id: { type: string, format: uuid, description: 通知 UUID }
        title: { type: string, description: 通知标题 }
        content: { type: string, description: 通知正文 }
        channel: { type: string, description: 通知渠道，当前为 IN_APP }
        relationType: { type: [string, 'null'], description: 关联业务资源类型 }
        relationId: { type: [string, 'null'], format: uuid, description: 关联业务资源 UUID }
        readAt: { type: [string, 'null'], format: date-time, description: 当前成员阅读时间 }
        createdAt: { type: string, format: date-time, description: 通知投递时间 }

    NotificationList:
      type: object
      additionalProperties: false
      required: [items, nextCursor, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationResult' }
        nextCursor: { type: [string, 'null'], format: uuid }
        unreadCount: { type: integer, minimum: 0, description: 当前成员未读通知总数 }

    NotificationUnreadCount:
      type: object
      additionalProperties: false
      required: [unreadCount]
      properties:
        unreadCount: { type: integer, minimum: 0 }

    NotificationMarkAllRead:
      type: object
      additionalProperties: false
      required: [updatedCount]
      properties:
        updatedCount: { type: integer, minimum: 0, description: 本次标记为已读的通知数 }

    NotificationResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
