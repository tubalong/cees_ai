    DingTalkConnectorTool:
      type: object
      additionalProperties: false
      required: [toolId, name, description, parameters]
      properties:
        toolId:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^dws_read_[a-f0-9]{16}$'
        name:
          type: string
          minLength: 1
          maxLength: 240
          description: DWS canonical_path
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: Read-only tool purpose extracted from the current DWS Schema
        parameters:
          type: object
          additionalProperties: true
          description: JSON Schema used by the model to produce arguments; root must be an object

    DingTalkConnectorPlanRequest:
      type: object
      additionalProperties: false
      required: [query, tools]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 10000
        tools:
          type: array
          minItems: 1
          maxItems: 1500
          items:
            $ref: '#/components/schemas/DingTalkConnectorTool'

    DingTalkConnectorPlannedCall:
      type: object
      additionalProperties: false
      required: [toolId, arguments]
      properties:
        toolId:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^dws_read_[a-f0-9]{16}$'
        arguments:
          type: object
          additionalProperties: true

    DingTalkConnectorPlanResult:
      type: object
      additionalProperties: false
      required: [calls]
      properties:
        calls:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/DingTalkConnectorPlannedCall'

    DingTalkConnectorPlanResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/DingTalkConnectorPlanResult'
        requestId:
          type: [string, 'null']
          description: Public API request trace ID

    TurnStatus:
      type: string
      enum: [RECEIVED, RUNNING, COMPLETED, FAILED, CANCELLED]
      description: 轮次状态；RECEIVED 为已接收未开始，RUNNING 为执行中

    Turn:
      type: object
      additionalProperties: false
      required: [id, conversationId, status, mode, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 轮次 ID
        conversationId:
          type: string
          format: uuid
          description: 所属会话 ID
        status:
          $ref: '#/components/schemas/TurnStatus'
        mode:
          $ref: '#/components/schemas/ChatMode'
        error:
          type: [object, 'null']
          description: 轮次失败时的错误信息；其他状态为 null
        createdAt:
          type: string
          format: date-time
          description: 轮次创建时间
        completedAt:
          type: [string, 'null']
          format: date-time
          description: 轮次到达终态的时间；未结束时为 null

    TurnResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Turn'
        requestId:
          type: [string, 'null']
          description: 公开 API 请求追踪 ID

    ChatTokenUsage:
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens, totalTokens]
      properties:
        inputTokens:
          type: [integer, 'null']
          minimum: 0
          description: Provider 报告的输入 Token；未报告时为 null
        outputTokens:
          type: [integer, 'null']
          minimum: 0
          description: Provider 报告的输出 Token；未报告时为 null
        totalTokens:
          type: [integer, 'null']
          minimum: 0
          description: Provider 报告的总 Token；未报告时为 null

    ChatContextStrategy:
      type: string
      enum: [full, summary_plus_recent, recent_only]
      description: ai-service 实际采用的上下文策略

    ChatContextUsage:
      type: object
      additionalProperties: false
      required: [strategy, receivedMessageCount, includedMessageCount, historyTruncated, estimatedInputTokens]
      properties:
        strategy:
          $ref: '#/components/schemas/ChatContextStrategy'
        receivedMessageCount:
          type: integer
          minimum: 1
          description: API 向 ai-service 提交的消息条数
        includedMessageCount:
          type: integer
          minimum: 1
          description: 上下文预算处理后实际纳入的消息条数
        historyTruncated:
          type: boolean
          description: 是否因上下文预算舍弃了较早消息
        estimatedInputTokens:
          type: integer
          minimum: 1
          description: ai-service 在模型调用前估算的输入 Token

    TurnStreamStartedEvent:
      type: object
      additionalProperties: false
      required: [type, seq, requestId, conversationId, turnId, mode, contextUsage]
      properties:
        type:
          type: string
          const: started
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号，用于断线重连时定位重放起点
        requestId:
          type: string
          description: 公开 API 请求追踪 ID
        conversationId:
          type: string
          format: uuid
          description: 所属服务端会话 ID
        turnId:
          type: string
          format: uuid
          description: 本轮轮次 ID
        mode:
          $ref: '#/components/schemas/ChatMode'
        contextUsage:
          $ref: '#/components/schemas/ChatContextUsage'
        capabilities:
          $ref: '#/components/schemas/TurnCapabilities'

    TurnCapabilities:
      type: object
      additionalProperties: false
      required: [webSearch, knowledgeBase, autoEnabled]
      description: 本轮实际生效的对话能力；由显式开关与服务端意图自动启用合并后得出
      properties:
        webSearch:
          type: boolean
          description: 本轮实际是否启用联网搜索
        knowledgeBase:
          type: boolean
          description: 本轮实际是否启用知识库检索
        autoEnabled:
          type: array
          description: 由服务端意图识别自动启用的能力标识；用户显式开启的不计入，供前端展示透明提示
          items:
            type: string
            enum: [web_search, knowledge_search]

    TurnPhase:
      type: string
      enum: [reasoning, answering, tool_executing]
      description: 当前只公开推理中、回答中或工具执行中阶段，不公开模型原始推理正文

    TurnStreamStatusEvent:
      type: object
      additionalProperties: false
      required: [type, seq, phase]
      properties:
        type:
          type: string
          const: status
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        phase:
          $ref: '#/components/schemas/TurnPhase'

    TurnStreamContentDeltaEvent:
      type: object
      additionalProperties: false
      required: [type, seq, text]
      properties:
        type:
          type: string
          const: content_delta
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        text:
          type: string
          description: 本次新增的回答正文片段

    TurnStreamUsageEvent:
      type: object
      additionalProperties: false
      required: [type, seq, tokenUsage]
      properties:
        type:
          type: string
          const: usage
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        tokenUsage:
          $ref: '#/components/schemas/ChatTokenUsage'

    TurnStreamToolCallEvent:
      type: object
      additionalProperties: false
      required: [type, seq, toolCallId, name, arguments]
      properties:
        type:
          type: string
          const: tool_call
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        toolCallId:
          type: string
          format: uuid
          description: 本次工具调用的稳定标识
        name:
          type: string
          description: 模型请求执行的受控工具名
        arguments:
          type: object
          additionalProperties: true
          description: 模型生成并经过 API 校验的工具参数
      description: 模型请求执行一个受控工具；具体是否执行由 API 根据权限、能力和额度决定。

    TurnStreamToolResultEvent:
      type: object
      additionalProperties: false
      required: [type, seq, toolCallId, status, resource, error]
      properties:
        type:
          type: string
          const: tool_result
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        toolCallId:
          type: string
          format: uuid
          description: 对应 TurnStreamToolCallEvent 中的 toolCallId
        status:
          type: string
          enum: [completed, failed, rejected, awaiting_confirmation]
          description: 工具执行结果状态；awaiting_confirmation 表示写操作已生成待确认草稿，副作用尚未发生
        resource:
          oneOf:
            - $ref: '#/components/schemas/ToolResultResourceReference'
            - type: 'null'
          description: 工具生成的稳定正式资源引用；访问 URL 必须通过对应资源接口按需获取（图片为 GET /api/v1/images/{imageId}）；事件与历史消息一律不携带签名 URL
        sources:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: '#/components/schemas/ToolSource'
          description: 联网搜索等非资源型工具返回的结构化来源；老客户端可忽略该字段
        citations:
          type: array
          maxItems: 20
          default: []
          items:
            $ref: '#/components/schemas/KnowledgeToolCitation'
          description: 知识库检索工具命中的文档引用；老客户端可忽略该字段
        confirmation:
          oneOf:
            - $ref: '#/components/schemas/ToolResultConfirmation'
            - type: 'null'
          description: 写操作的待确认预览；status 为 awaiting_confirmation 时必定存在
        error:
          type: [object, 'null']
          description: 工具失败或被拒绝时的错误信息
      description: 工具执行完成、失败或被 API 拒绝时发送的事件。

    ToolResultResourceReference:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [IMAGE, DOCUMENT]
          description: 正式资源类型
        id:
          type: string
          format: uuid
          description: 正式资源 ID

    ToolResultConfirmationField:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
          maxLength: 40
          description: 字段名，例如「部门名称」
        value:
          type: string
          maxLength: 500
          description: 字段值（已格式化，不含内部 ID 与权限枚举）

    ToolResultConfirmation:
      type: object
      additionalProperties: false
      required: [draftId, toolName, title, fields, expiresAt]
      properties:
        draftId:
          type: string
          format: uuid
          description: 待确认草稿 ID；确认与取消接口只接受该 ID，不接受重新提交参数
        toolName:
          type: string
          description: 将要执行的受控工具名（面向开发者，不用于展示）
        title:
          type: string
          maxLength: 200
          description: 动作标题，例如「新建部门」
        fields:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ToolResultConfirmationField'
          description: 参数预览字段，供确认卡片展示
        expiresAt:
          type: string
          format: date-time
          description: 草稿过期时间；过期后确认接口返回 409，需重新发起对话
      description: 写操作的待确认预览；用户确认前不产生任何业务副作用

    ToolSource:
      type: object
      additionalProperties: false
      required: [id, title, url, domain, snippet, publishedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
          description: 当前工具调用内稳定的来源 ID
        title:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          format: uri
          maxLength: 4096
        domain:
          type: string
          minLength: 1
          maxLength: 255
        snippet:
          type: string
          maxLength: 5000
        publishedAt:
          type: [string, 'null']
          format: date-time
      description: 联网搜索返回的公开网页来源，不代表 CEES 正式业务资源

    KnowledgeToolCitation:
      type: object
      additionalProperties: false
      required: [id, title, snippet]
      properties:
        id:
          type: string
          format: uuid
          description: 知识库文档 ID
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: 文档标题
        snippet:
          type: string
          maxLength: 2000
          description: 命中的正文片段
        pageIndex:
          type: [integer, 'null']
          minimum: 0
          description: 命中文档页码；解析器未提供页码时为 null
        knowledgeBaseId:
          type: string
          format: uuid
          description: 文档所属知识库 ID；用于对话页定位与删除操作
        deletable:
          type: boolean
          default: false
          description: 当前用户是否为该文档所属库的 EDITOR 及以上成员（或 manage_all），可直接删除该文档
      description: 知识库检索命中的文档引用，属于 CEES 正式业务资源

    TurnStreamCompletedEvent:
      type: object
      additionalProperties: false
      required: [type, seq, latencyMs, finishReason]
      properties:
        type:
          type: string
          const: completed
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        latencyMs:
          type: integer
          minimum: 0
          description: ai-service 报告的模型调用耗时，单位毫秒
        finishReason:
          type: [string, 'null']
          description: Provider 结束原因；length 表示回答可能被输出上限截断

    TurnStreamRelatedQuestionsEvent:
      type: object
      additionalProperties: false
      required: [type, seq, questions]
      properties:
        type:
          type: string
          const: related_questions
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号；位于 completed 之后
        questions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 30
          description: 基于本轮答复生成的简短追问建议，每个不超过 30 字

    TurnErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: 稳定错误码
        message:
          type: string
          description: 可安全展示或记录的错误说明
        retryable:
          type: boolean
          description: 是否适合由用户主动重试

    TurnStreamErrorEvent:
      type: object
      additionalProperties: false
      required: [type, seq, error]
      properties:
        type:
          type: string
          const: error
        seq:
          type: integer
          minimum: 1
          description: 轮次内递增的事件序号
        error:
          type: object
          description: 终止本轮的错误信息，结构同 TurnErrorDetail

    TurnStreamEvent:
      oneOf:
        - $ref: '#/components/schemas/TurnStreamStartedEvent'
        - $ref: '#/components/schemas/TurnStreamStatusEvent'
        - $ref: '#/components/schemas/TurnStreamContentDeltaEvent'
        - $ref: '#/components/schemas/TurnStreamToolCallEvent'
        - $ref: '#/components/schemas/TurnStreamToolResultEvent'
        - $ref: '#/components/schemas/TurnStreamUsageEvent'
        - $ref: '#/components/schemas/TurnStreamCompletedEvent'
        - $ref: '#/components/schemas/TurnStreamRelatedQuestionsEvent'
        - $ref: '#/components/schemas/TurnStreamErrorEvent'
      discriminator:
        propertyName: type
        mapping:
          started: '#/components/schemas/TurnStreamStartedEvent'
          status: '#/components/schemas/TurnStreamStatusEvent'
          content_delta: '#/components/schemas/TurnStreamContentDeltaEvent'
          tool_call: '#/components/schemas/TurnStreamToolCallEvent'
          tool_result: '#/components/schemas/TurnStreamToolResultEvent'
          usage: '#/components/schemas/TurnStreamUsageEvent'
          completed: '#/components/schemas/TurnStreamCompletedEvent'
          related_questions: '#/components/schemas/TurnStreamRelatedQuestionsEvent'
          error: '#/components/schemas/TurnStreamErrorEvent'

