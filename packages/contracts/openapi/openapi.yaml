      required: [id, minCreditUnit, resetDay, resetTimezoneMode, rejectUnconfiguredRate, subscriptionDurations, halfYearlyDiscountRate, yearlyDiscountRate, maxSubscriptionUnits, updatedAt, version]
      properties:
        id: { type: string, description: 固定主键 default }
        minCreditUnit: { type: string, pattern: '^\d{1,3}(\.\d)?$', description: 最小计量单位（credit），如 0.1 }
        resetDay: { type: integer, minimum: 1, maximum: 28, description: 每月重置日（企业本地时区） }
        resetTimezoneMode: { type: string, enum: [TENANT_LOCAL], description: 重置时区模式（企业本地时区，值预留扩展） }
        rejectUnconfiguredRate: { type: boolean, description: 未配置费率的调用一律拒绝 }
        subscriptionDurations:
          type: array
          items: { $ref: "#/components/schemas/AICreditSubscriptionDuration" }
          description: 可配置的订阅持续时间选项
        halfYearlyDiscountRate: { type: string, pattern: '^0\.\d{1,2}$', description: 半年折扣率（0.01-0.99） }
        yearlyDiscountRate: { type: string, pattern: '^0\.\d{1,2}$', description: 一年折扣率（0.01-0.99） }
        maxSubscriptionUnits: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

