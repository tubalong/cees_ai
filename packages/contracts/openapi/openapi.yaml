openapi: 3.1.0
info:
  title: CEES AI API
  version: 0.8.0
  description: 以本文件为唯一事实源的公开 API 契约。资源与操作按 docs/api 约定补充。

servers:
  - url: http://localhost:3000/api/v1

paths:
  /health:
    get:
      summary: 健康检查
      operationId: health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /auth/login:
    post:
      summary: 使用租户编码、账号和密码登录
      operationId: authLogin
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录凭证无效或账户不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/refresh:
    post:
      summary: 使用 Refresh Token 轮换访问令牌和刷新令牌
      operationId: authRefresh
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 令牌轮换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: Refresh Token 无效、过期或已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/activate:
    post:
      summary: 使用一次性激活令牌设置租户账号密码
      operationId: authActivate
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTenantInvitationRequest"
      responses:
        '200':
          description: 租户账号激活成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitationAcceptanceResponseEnvelope"
        '401':
          description: 激活令牌无效、过期或已使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/logout:
    post:
      summary: 撤销当前登录会话
      operationId: authLogout
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 当前会话已撤销
        "401":
          description: Access Token 无效或 Session 已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/me:
    get:
      summary: 获取当前用户、租户、角色和权限
      operationId: authMe
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前认证上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponseEnvelope"
        "401":
          description: Access Token 无效或 Session 已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current:
    get:
      summary: 获取当前租户
      operationId: tenantGetCurrent
      tags:
        - Tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 tenant.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    patch:
      summary: 修改当前租户
      operationId: tenantUpdateCurrent
      tags:
        - Tenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: 修改后的租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 tenant.update 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current/departments:
    get:
      summary: 查询当前租户部门树
      operationId: departmentListTree
      tags:
        - Organization
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DepartmentStatus'
      responses:
        '200':
          description: 当前租户部门树
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentTreeResponseEnvelope'
        '401':
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: 缺少 department.read 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
    post:
      summary: 创建当前租户部门
      operationId: departmentCreate
      tags:
        - Organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '201':
          description: 已创建部门
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponseEnvelope'
        '400':
          description: 请求字段或部门层级无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: 缺少 department.create 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 父部门不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 同级部门名称冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /tenants/current/departments/{departmentId}:
    parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 获取当前租户部门详情
      operationId: departmentGet
      tags:
        - Organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 部门详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponseEnvelope'
        '401':
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: 缺少 department.read 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 当前租户内部门不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
    patch:
      summary: 修改当前租户部门
      operationId: departmentUpdate
      tags:
        - Organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
      responses:
        '200':
          description: 修改后的部门
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponseEnvelope'
        '400':
          description: 请求字段、父子关系或部门层级无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: 缺少 department.update 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 当前部门或父部门不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 版本或同级部门名称冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
    delete:
      summary: 删除当前租户部门
      operationId: departmentDelete
      tags:
        - Organization
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: 部门已删除
        '400':
          description: 版本参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: 缺少 department.delete 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 当前租户内部门不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 版本冲突或部门仍有子部门、成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /tenants/current/departments/{departmentId}/members:
    parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 查询当前租户部门成员
      operationId: departmentListMembers
      tags:
        - Organization
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MemberStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 当前部门成员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMemberListResponseEnvelope'
        '400':
          description: 查询参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: 缺少 department.read 或 member.read 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 当前租户内部门不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /tenants/current/members/{membershipId}/department:
    parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: 调整当前租户成员部门
      operationId: departmentAssignMember
      tags:
        - Organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTenantMemberDepartmentRequest'
      responses:
        '200':
          description: 调整部门后的成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMemberResponseEnvelope'
        '400':
          description: 请求字段校验失败或目标部门已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '403':
          description: 缺少 department.member.assign 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 当前租户内成员或部门不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 成员版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /tenants/current/members:
    get:
      summary: 查询当前租户成员
      operationId: tenantListMembers
      tags:
        - Tenant
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MemberStatus"
        - name: roleId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 当前租户成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMemberListResponseEnvelope"
        "400":
          description: 查询参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 member.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current/members/{membershipId}:
    parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 获取当前租户成员详情
      operationId: tenantGetMember
      tags:
        - Tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成员详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMemberResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 member.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内成员不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    patch:
      summary: 修改当前租户成员
      operationId: tenantUpdateMember
      tags:
        - Tenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantMemberRequest"
      responses:
        "200":
          description: 修改后的成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMemberResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 member.update 或 department.member.assign 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内成员或部门不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 最后一名管理员、自操作或版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    delete:
      summary: 移除当前租户成员
      operationId: tenantRemoveMember
      tags:
        - Tenant
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 成员已移除且相关 Session 已撤销
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 member.remove 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内成员不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 不能移除自己或最后一名管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current/members/{membershipId}/roles:
    parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: 替换当前租户成员的角色集合
      operationId: tenantReplaceMemberRoles
      tags:
        - Tenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceTenantMemberRolesRequest"
      responses:
        "200":
          description: 更新角色后的成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMemberResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 role.assign 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内成员或角色不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 最后一名管理员或版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current/account-suggestions:
    post:
      summary: 根据成员姓名生成当前租户可用账号建议
      operationId: tenantSuggestAccount
      tags: [Tenant]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSuggestionRequest"
      responses:
        '200':
          description: 账号建议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSuggestionResponseEnvelope"

  /tenants/current/members/{membershipId}/account:
    patch:
      summary: 修改租户成员登录账号并撤销其现有会话
      operationId: tenantUpdateMemberAccount
      tags: [Tenant]
      security:
        - bearerAuth: []
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantMemberAccountRequest"
      responses:
        '200':
          description: 修改账号后的成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMemberResponseEnvelope"
        '409':
          description: 账号已存在或版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current/members/{membershipId}/credential-reset:
    post:
      summary: 重置租户成员凭证并签发一次性激活令牌
      operationId: tenantResetMemberCredential
      tags: [Tenant]
      security:
        - bearerAuth: []
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: 凭证重置成功；激活令牌只在本次响应返回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitationCreatedResponseEnvelope"
        '409':
          description: 不能重置自己或最后一名有效管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /permissions:
    get:
      summary: 获取平台预置权限目录
      operationId: rbacListPermissions
      tags: [RBAC]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 权限目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
