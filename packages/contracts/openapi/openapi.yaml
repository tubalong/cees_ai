openapi: 3.1.0
info:
  title: CEES AI API
  version: 0.43.0
  description: 以本文件为唯一事实源的公开 API 契约。资源与操作按 docs/api 约定补充。

servers:
  - url: http://localhost:3000/api/v1

paths:
  /health:
    get:
      summary: 健康检查
      operationId: health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /assistant/connectors/dingtalk/plan:
    post:
      summary: Plan read-only DingTalk DWS queries for the current question
      description: |
        Desktop dynamically discovers read-only tools from the locally installed DWS Schema. The API only asks the model
        to select tools and arguments; it never stores DWS credentials or executes local commands. Before execution, Desktop
        must reload the leaf Schema and verify effect=read, confirmation=not_required, and availability=available.
      operationId: planDingTalkConnectorQueries
      tags: [Conversation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DingTalkConnectorPlanRequest'
      responses:
        '200':
          description: Up to three local read-only calls; calls is empty when DingTalk data is unnecessary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DingTalkConnectorPlanResponseEnvelope'
        '400':
          description: Invalid query or tool catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: Authentication or tenant membership is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '502':
          description: AI provider returned an invalid plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '503':
          description: AI service or model is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /assistant/connectors/tencent-meeting/plan:
    post:
      summary: Plan Tencent Meeting official CLI calls for the current question
      description: |
        Desktop installs a pinned official @tencentcloud/tmeet CLI, completes browser OAuth locally, and derives the
        version-aligned command schema from the installed CLI help. The API only asks the model to select tool names and
        arguments; OAuth credentials remain in the CLI-owned encrypted Desktop directories and are never uploaded to
        CEES API. Desktop must request explicit user confirmation before executing any WRITE or DESTRUCTIVE command.
      operationId: planTencentMeetingConnectorQueries
      tags: [Conversation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TencentMeetingConnectorPlanRequest'
      responses:
        '200':
          description: Up to three local official-CLI calls; calls is empty when Tencent Meeting data is unnecessary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TencentMeetingConnectorPlanResponseEnvelope'
        '400':
          description: Invalid query or version-aligned CLI command catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: Authentication or tenant membership is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '502':
          description: AI provider returned an invalid plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '503':
          description: AI service or model is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /assistant/connectors/wecom/plan:
    post:
      summary: Plan WeCom official CLI calls for the current question
      description: |
        Desktop installs the pinned official WeCom CLI and dynamically discovers tools after the user authorizes an
        intelligent bot by QR code. The API only asks the model to select tool names and arguments; WeCom authorization
        remains in the Desktop-managed CLI config directory and is never uploaded to CEES API. Desktop must request
        explicit user confirmation before executing any tool marked as WRITE or DESTRUCTIVE.
      operationId: planWeComConnectorQueries
      tags: [Conversation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeComConnectorPlanRequest'
      responses:
        '200':
          description: Up to three local CLI calls; calls is empty when WeCom data is unnecessary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeComConnectorPlanResponseEnvelope'
        '400':
          description: Invalid query or dynamic tool catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: Authentication or tenant membership is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '502':
          description: AI provider returned an invalid plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '503':
          description: AI service or model is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /assistant/connectors/github/plan:
    post:
      summary: Plan GitHub official remote MCP calls for the current question
      description: |
        Desktop connects to the fixed GitHub-hosted remote MCP endpoint and sends the dynamically discovered tool
        catalog. The API only plans tool names and arguments; GitHub OAuth credentials and MCP execution remain in
        the Desktop Main Process. Desktop must require explicit confirmation before executing WRITE or DESTRUCTIVE tools.
      operationId: planGitHubConnectorQueries
      tags: [Conversation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubConnectorPlanRequest'
      responses:
        '200':
          description: Up to three GitHub remote MCP calls; calls is empty when GitHub data is unnecessary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubConnectorPlanResponseEnvelope'
        '400':
          description: Invalid query or MCP tool catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: Authentication or tenant membership is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '502':
          description: AI provider returned an invalid plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '503':
          description: AI service or model is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /assistant/action-drafts/{draftId}/confirm:
    post:
      summary: 确认并执行 AI 写操作草稿
      description: |
        写工具（riskLevel=WRITE）在对话中不会直接执行：模型只产出参数与预览，服务端落为
        待确认草稿并在 tool_result 事件的 confirmation 字段里返回。用户确认后调用本接口。
        服务端只信任草稿内保存的参数快照，重新解析成员实时权限并重新执行参数校验，
        因此确认前被回收权限或停用成员都不会产生写入。PENDING_CONFIRMATION → EXECUTING
        通过条件更新抢占：重复确认返回同一结果，不会重复写入。
      operationId: confirmAssistantActionDraft
      tags: [Conversation]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 草稿已执行, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantActionDraftResolutionEnvelope' } } } }
        '403': { description: 确认瞬间权限已不足, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '404': { description: 草稿不存在或不属于当前成员, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '409': { description: 草稿已过期、已取消或已被处理, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }

  /assistant/action-drafts/{draftId}/cancel:
    post:
      summary: 取消 AI 写操作草稿
      description: 用户拒绝执行草稿。取消后草稿进入 REJECTED 终态，不可再确认；需重新发起对话生成新草稿。
      operationId: cancelAssistantActionDraft
      tags: [Conversation]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 草稿已取消, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantActionDraftResolutionEnvelope' } } } }
        '404': { description: 草稿不存在或不属于当前成员, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '409': { description: 草稿已过期、已执行或已被处理, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }

  /conversations:
    post:
      summary: 创建当前成员的私有 AI 会话
      description: |
        创建属于当前租户成员的私有会话。标题可省略，服务端在首轮完成后根据首条消息自动生成。
      operationId: createConversation
      tags: [Conversation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '200':
          description: 会话创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponseEnvelope'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

    get:
      summary: 查询当前成员的会话列表
      description: 按更新时间倒序返回当前成员的私有会话。
      operationId: listConversations
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 每页数量，默认 20，最大 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: 分页游标，上一页返回的 nextCursor
          schema:
            type: string
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponseEnvelope'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /conversations/{conversationId}:
    get:
      summary: 查询会话详情与最近消息
      description: |
        返回会话元数据与最近消息（按时间升序，最多 100 条）。只有会话所属成员可以访问。
      operationId: getConversation
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailResponseEnvelope'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话不存在或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

    patch:
      summary: 修改当前成员私有会话的标题
      description: 使用会话版本进行乐观并发控制；版本不匹配时返回 409。
      operationId: updateConversation
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: 返回修改后的会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponseEnvelope'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态或租户成员身份无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话不存在或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 会话版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
    delete:
      summary: 软删除当前成员的私有会话
      description: 删除只隐藏会话；消息、工具调用、事件和审计事实保留。存在运行中轮次时返回 409。
      operationId: deleteConversation
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: true
          description: 当前会话版本
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: 会话已软删除
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态或租户成员身份无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话不存在或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 会话版本冲突或仍有执行中的轮次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /conversations/{conversationId}/turns:
    post:
      summary: 发起一轮对话并以 SSE 流式返回事件
      description: |
        客户端只提交本轮 user 消息；历史消息与摘要由服务端加载并组装上下文。
        成功建立流后，每个 SSE `data` 字段都是一个 `TurnStreamEvent` JSON 对象，所有事件携带递增 `seq`。
        事件依次为 `started`、可选 `status`、零个或多个 `content_delta`、可选 `usage` 和 `completed`；
        `completed` 之后可能异步到达一个 `related_questions` 事件（基于本轮答复生成的后续提问建议，生成失败则不发）；
        流开始后的失败以 `error` 事件终止。
        客户端断开连接只解除订阅，不取消执行；重连后通过事件重放接口继续接收。
        重复提交同一 `Idempotency-Key` 时返回原 Turn 的事件流，不重新生成。
      operationId: createTurn
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: 客户端生成的幂等键；同一键重复提交返回原 Turn
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTurnRequest'
      responses:
        '200':
          description: 对话事件流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TurnStreamEvent'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话不存在或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 同一幂等键对应不同请求内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '422':
          description: 对话上下文不符合规则或超过预算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '502':
          description: AI Provider 返回了无效结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '503':
          description: ai-service、对话模式或模型暂时不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /conversations/{conversationId}/turns/{turnId}/events:
    get:
      summary: 以 SSE 重放并继续接收轮次事件
      description: |
        客户端携带已收到的最后事件序号 `afterSeq` 重新订阅；服务端先重放该序号之后的已持久化事件，
        再继续实时推送后续事件直到轮次终态。轮次已结束时，重放全部剩余事件后正常结束。
      operationId: replayTurnEvents
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
        - name: turnId
          in: path
          required: true
          description: 轮次 ID
          schema:
            type: string
            format: uuid
        - name: afterSeq
          in: query
          required: false
          description: 已收到的最后事件序号；省略时从首个事件开始重放
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 轮次事件流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TurnStreamEvent'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话或轮次不存在，或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /conversations/{conversationId}/turns/{turnId}/cancel:
    post:
      summary: 取消正在执行的轮次
      description: |
        取消是显式动作，不是断线副作用。仅 RUNNING 状态的轮次可取消；
        取消后服务端尽力停止后续模型调用，已写入的正式业务数据不回滚。
      operationId: cancelTurn
      tags: [Conversation]
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            format: uuid
        - name: turnId
          in: path
          required: true
          description: 轮次 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 轮次已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponseEnvelope'
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '401':
          description: 登录状态无效、已过期或缺少有效租户成员身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '404':
          description: 会话或轮次不存在，或不属于当前成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '409':
          description: 轮次已结束，不能取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /auth/login:
    post:
      summary: 使用租户编码、账号和密码登录
      operationId: authLogin
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录凭证无效或账户不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/refresh:
    post:
      summary: 使用 Refresh Token 轮换访问令牌和刷新令牌
      operationId: authRefresh
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 令牌轮换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
