      properties:
        query:
          type: string
          minLength: 1
          maxLength: 10000
        tools:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/WeComConnectorTool'

    WeComConnectorPlannedCall:
      type: object
      additionalProperties: false
      required: [toolId, arguments]
      properties:
        toolId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[A-Za-z][A-Za-z0-9._-]{0,119}$'
        arguments:
          type: object
          additionalProperties: true

    WeComConnectorPlanResult:
      type: object
      additionalProperties: false
      required: [calls]
      properties:
        calls:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/WeComConnectorPlannedCall'

    WeComConnectorPlanResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/WeComConnectorPlanResult'
        requestId:
          type: [string, 'null']
          description: Public API request trace ID

    GitHubConnectorToolRisk:
      type: string
      enum: [READ, WRITE, DESTRUCTIVE]

    GitHubConnectorTool:
      type: object
      additionalProperties: false
      required: [toolId, name, description, parameters, riskLevel, requiresConfirmation]
      properties:
        toolId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[A-Za-z][A-Za-z0-9._-]{0,119}$'
          description: GitHub remote MCP tool name discovered from tools/list
        name:
          type: string
          minLength: 1
          maxLength: 240
        description:
          type: string
          minLength: 1
          maxLength: 4000
        parameters:
          type: object
          additionalProperties: true
          description: JSON Schema dynamically returned by GitHub MCP; root must be an object
        riskLevel:
          $ref: '#/components/schemas/GitHubConnectorToolRisk'
        requiresConfirmation:
          type: boolean
          description: Desktop must require explicit confirmation before executing this tool

    GitHubConnectorPlanRequest:
      type: object
      additionalProperties: false
      required: [query, tools]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 10000
        tools:
          type: array
          minItems: 1
