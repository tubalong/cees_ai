            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: 修改后的任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponseEnvelope' }
        '400': { description: 字段或父子关系无效, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '403': { description: 需要 task.update 权限及任务负责人或项目 OWNER/MANAGER 身份, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '404': { description: 项目或任务不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '409': { description: 项目只读、任务终态或版本冲突, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
    delete:
      summary: 删除任务
      operationId: taskDelete
      tags: [Task]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 任务已软删除 }
        '403': { description: 缺少 task.delete 权限或不是任务管理者, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '404': { description: 项目或任务不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '409': { description: 项目只读、任务存在子任务或版本冲突, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }

  /projects/{projectId}/tasks/{taskId}/transitions:
