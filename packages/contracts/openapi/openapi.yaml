          items:
            $ref: '#/components/schemas/GitHubConnectorTool'

    GitHubConnectorPlannedCall:
      type: object
      additionalProperties: false
      required: [toolId, arguments]
      properties:
        toolId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[A-Za-z][A-Za-z0-9._-]{0,119}$'
