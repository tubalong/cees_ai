    post:
      summary: 标记单条通知为已读
      operationId: notificationMarkRead
      tags: [Notification]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 通知已读, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationResponseEnvelope' } } } }
        '403': { description: 缺少 notification.read 权限, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
