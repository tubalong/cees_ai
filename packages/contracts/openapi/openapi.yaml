    KnowledgeBaseVisibilityScope:
      type: string
      enum: [PRIVATE, DEPARTMENT, PROJECT, TENANT]
      description: 知识库归属；PRIVATE 仅成员（默认），DEPARTMENT 部门树成员，PROJECT 项目成员，TENANT 租户全员

    KnowledgeBaseMemberPermission:
      type: string
      enum: [READER, EDITOR, MANAGER]
      description: 知识库成员权限，从低到高分别为只读、编辑和管理

    KnowledgeBase:
      type: object
      required:
        - id
        - tenantId
        - name
        - description
        - visibilityScope
        - departmentId
        - projectId
        - memberCount
        - myPermission
        - createdBy
        - updatedBy
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        visibilityScope:
          $ref: '#/components/schemas/KnowledgeBaseVisibilityScope'
        departmentId:
          type: [string, 'null']
          format: uuid
          description: 归属锚点；DEPARTMENT 时挂部门，其余为空
        projectId:
          type: [string, 'null']
          format: uuid
          description: 归属锚点；PROJECT 时挂项目，其余为空
        memberCount:
          type: integer
          minimum: 0
        myPermission:
          $ref: '#/components/schemas/KnowledgeBaseMemberPermission'
          description: 当前用户对该库的成员等级；锚点人群与 read_all 恒 READER，manage_all 恒 MANAGER
        createdBy:
          type: [string, 'null']
          format: uuid
        updatedBy:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KnowledgeBaseList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeBase'
        nextCursor:
          type: [string, 'null']
          format: uuid

    KnowledgeQueryRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4096
          description: 提问内容
        indexVersion:
          type: [string, 'null']
          maxLength: 64
          description: 向量索引版本；不填使用服务端默认版本

    KnowledgeQueryCitation:
      type: object
      additionalProperties: false
      required:
        - citationId
        - documentId
        - documentVersionId
        - chunkId
        - text
      properties:
        citationId:
          type: string
          description: 答案中引用的短编号，如 S1
        documentId:
          type: string
          format: uuid
        documentVersionId:
          type: string
          format: uuid
        chunkId:
          type: string
          description: 向量库 chunk 标识
        text:
          type: string
          description: 引用原文片段
        score:
          type: number
          description: 向量相似度得分
        pageIndex:
          type: [integer, 'null']
          minimum: 0
          description: 原文页码，从 0 开始
        bbox:
          type: [array, 'null']
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: 页内定位框 [x0, y0, x1, y1]

    KnowledgeQueryResponse:
      type: object
      required: [answer, grounded, insufficientEvidence, citations]
      properties:
        answer:
          type: string
          description: 基于证据的答案；证据不足时为空串
        grounded:
          type: boolean
          description: 答案是否由引用支撑；证据不足时恒为 false
        insufficientEvidence:
          type: boolean
          description: 检索无结果或模型判定证据不足以回答时为 true
        citations:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeQueryCitation'

    KnowledgeQueryResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/KnowledgeQueryResponse'
        requestId:
          type: [string, 'null']

    KnowledgeBaseMember:
      type: object
      required:
        - id
        - tenantId
        - knowledgeBaseId
        - membershipId
        - userId
        - account
        - displayName
        - permission
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        knowledgeBaseId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        account:
          type: string
        displayName:
          type: string
        permission:
          $ref: '#/components/schemas/KnowledgeBaseMemberPermission'
        createdAt:
          type: string
          format: date-time

    KnowledgeBaseMemberList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeBaseMember'
        nextCursor:
          type: [string, 'null']
          format: uuid

    CreateKnowledgeBaseRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000
        visibilityScope:
          $ref: '#/components/schemas/KnowledgeBaseVisibilityScope'
          description: 归属范围，默认 PRIVATE；DEPARTMENT 必填 departmentId，PROJECT 必填 projectId，两者互斥
        departmentId:
          type: string
          format: uuid
          description: 归属部门，必须属于当前租户；仅 DEPARTMENT 时使用
        projectId:
          type: string
          format: uuid
          description: 归属项目，必须属于当前租户；仅 PROJECT 时使用

    UpdateKnowledgeBaseRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000
        visibilityScope:
          $ref: '#/components/schemas/KnowledgeBaseVisibilityScope'
          description: 归属范围；未提供的锚点字段保持现值
        departmentId:
          type: [string, 'null']
          format: uuid
          description: 归属部门，必须属于当前租户；仅 DEPARTMENT 时使用，传 null 清除锚点
        projectId:
          type: [string, 'null']
          format: uuid
          description: 归属项目，必须属于当前租户；仅 PROJECT 时使用，传 null 清除锚点
        version:
          type: integer
          minimum: 1

    CreateKnowledgeBaseMemberRequest:
      type: object
      additionalProperties: false
      required: [membershipId, permission]
      properties:
        membershipId:
          type: string
          format: uuid
          description: 当前租户成员 ID，而不是全局用户 ID
        permission:
          $ref: '#/components/schemas/KnowledgeBaseMemberPermission'

    UpdateKnowledgeBaseMemberRequest:
      type: object
      additionalProperties: false
      required: [permission]
      properties:
        permission:
          $ref: '#/components/schemas/KnowledgeBaseMemberPermission'

    KnowledgeDocumentStatus:
      type: string
      enum: [PENDING, PARSING, PARSED, INDEXING, READY, FAILED]
      description: 知识库文档处理状态；PENDING 等待处理，PARSING 解析中，PARSED 解析完成，INDEXING 建立索引中，READY 可检索，FAILED 处理失败

    KnowledgeDocumentVisibilityScope:
      type: string
      enum: [PRIVATE, DEPARTMENT, PROJECT, TENANT]
      description: 文档可见范围；PRIVATE 仅知识库成员，DEPARTMENT 指定部门成员，PROJECT 指定项目成员，TENANT 租户全部成员

    KnowledgeDocument:
      type: object
      required:
        - id
        - tenantId
        - knowledgeBaseId
        - name
        - status
        - fileObjectId
        - versionNumber
        - currentVersionId
        - retryCount
        - lastError
        - visibilityScope
        - departmentId
        - projectId
        - createdBy
        - updatedBy
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        knowledgeBaseId:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/KnowledgeDocumentStatus'
        fileObjectId:
          type: string
          format: uuid
          description: 当前版本对应的文件对象 ID
        versionNumber:
          type: integer
          minimum: 1
          description: 当前版本号
        currentVersionId:
          type: string
          format: uuid
          description: 当前处理中的文档版本 ID
        retryCount:
          type: integer
          minimum: 0
        lastError:
          type: [string, 'null']
        visibilityScope:
          $ref: '#/components/schemas/KnowledgeDocumentVisibilityScope'
        departmentId:
          type: [string, 'null']
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
        createdBy:
          type: [string, 'null']
          format: uuid
        updatedBy:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KnowledgeDocumentList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeDocument'
        nextCursor:
          type: [string, 'null']
          format: uuid

    CreateKnowledgeDocumentRequest:
      type: object
      additionalProperties: false
      required: [visibilityScope]
      properties:
        fileObjectId:
          type: string
          format: uuid
          description: 人工上传路径：已上传完成的文件对象 ID；与 sourceType/sourceId 二选一
        sourceType:
          type: string
          enum: [FILE_OBJECT, DOCUMENT, MESSAGE]
          description: 转存路径：来源类型（附件文件 / AI 生成文档 / 对话消息），与 sourceId 配套，二选一必填
        sourceId:
          type: string
          format: uuid
          description: 转存路径：来源资源 ID，与 sourceType 配套
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: 文档名称；转存路径下省略时沿用来源资源名称
        visibilityScope:
          $ref: '#/components/schemas/KnowledgeDocumentVisibilityScope'
        departmentId:
          type: [string, 'null']
          format: uuid
          description: 可见范围为 DEPARTMENT 时必填
        projectId:
          type: [string, 'null']
          format: uuid
          description: 可见范围为 PROJECT 时必填

    CreateKnowledgeDocumentVersionRequest:
      type: object
      additionalProperties: false
      required: [fileObjectId, visibilityScope]
      properties:
        fileObjectId:
          type: string
          format: uuid
          description: 已上传完成的文件对象 ID
        visibilityScope:
          $ref: '#/components/schemas/KnowledgeDocumentVisibilityScope'
        departmentId:
          type: [string, 'null']
          format: uuid
          description: 可见范围为 DEPARTMENT 时必填
        projectId:
          type: [string, 'null']
          format: uuid
          description: 可见范围为 PROJECT 时必填

    ChatMode:
      type: string
      enum: [standard, ultra]
      default: standard
      description: 对话执行模式；省略时使用 standard

    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        mode:
          allOf:
            - $ref: '#/components/schemas/ChatMode'
          description: 会话默认对话执行模式；省略时使用 standard

    UpdateConversationRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          description: 新的会话标题
        version:
          type: integer
          minimum: 1
          description: 历史兼容字段，不再参与校验；服务端忽略该字段（每次发起轮次都会递增会话版本，旧客户端持有的版本必然过期）

    ConversationVisibility:
      type: string
      enum: [PRIVATE]
      default: PRIVATE
      description: 会话可见性；当前仅支持成员私有

    Conversation:
      type: object
      additionalProperties: false
      required: [id, title, visibility, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
          description: 会话 ID
        title:
          type: string
          maxLength: 128
          description: 会话标题；未自动生成前为空字符串
        visibility:
          $ref: '#/components/schemas/ConversationVisibility'
        mode:
          allOf:
            - $ref: '#/components/schemas/ChatMode'
          description: 会话默认对话执行模式；发起轮次未显式指定 mode 时使用
        createdAt:
          type: string
          format: date-time
          description: 会话创建时间
        updatedAt:
          type: string
          format: date-time
          description: 会话最近更新时间
        lastTurnAt:
          type: [string, 'null']
          format: date-time
          description: 最近一轮发起时间；尚未发起过轮次时为 null
        version:
          type: integer
          minimum: 1
          description: 会话资源版本；创建、发起轮次、改标题和删除都会递增

    ConversationResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Conversation'
        requestId:
          type: [string, 'null']
          description: 公开 API 请求追踪 ID

    ConversationListResult:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: 按更新时间倒序排列的会话
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          type: [string, 'null']
          description: 下一页游标；没有更多数据时为 null

    ConversationListResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ConversationListResult'
        requestId:
          type: [string, 'null']
          description: 公开 API 请求追踪 ID

    ConversationMessageRole:
      type: string
      enum: [USER, ASSISTANT, TOOL]
      description: 服务端持久化的会话消息角色

    ConversationMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, imageFileIds, connectorContexts, resources, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: 服务端生成的消息 ID
        role:
          $ref: '#/components/schemas/ConversationMessageRole'
        content:
          type: string
          maxLength: 262144
          description: 消息正文
        imageFileIds:
          type: array
          maxItems: 8
          uniqueItems: true
          description: 用户消息引用的稳定图片文件 ID（用户输入的附件），仅用户消息可能非空；展示/下载地址由前端通过文件接口按需获取
          items:
            type: string
            format: uuid
        connectorContexts:
          type: array
          maxItems: 3
          default: []
          description: 用户消息在该轮提交的已脱敏连接器上下文；其他角色固定为空数组。用于恢复连接器授权提示等确定性交互，不作为 CEES 权限或业务事实依据
          items:
            $ref: '#/components/schemas/ConnectorContext'
        resources:
          type: array
          maxItems: 20
          default: []
          description: 工具产生的稳定正式资源引用（IMAGE 为 AI 生成图片、DOCUMENT 为 AI 生成文档）；非 TOOL 消息为空数组；资源访问 URL 必须通过对应资源接口按需获取（图片为 GET /api/v1/images/{imageId}），消息正文不携带签名 URL
          items:
            $ref: '#/components/schemas/ToolResultResourceReference'
        sources:
          type: array
          maxItems: 20
          default: []
          description: TOOL 消息对应工具调用返回的结构化来源（联网搜索等非资源型工具）；其他角色固定为空数组；来源按轮次归属，老客户端可忽略该字段
          items:
            $ref: '#/components/schemas/ToolSource'
        citations:
          type: array
          maxItems: 20
          default: []
          description: TOOL 消息对应工具调用返回的知识库文档引用；其他角色固定为空数组；引用按轮次归属，老客户端可忽略该字段
          items:
            $ref: '#/components/schemas/KnowledgeToolCitation'
        createdAt:
          type: string
          format: date-time
          description: 消息写入时间
        turnId:
          type: [string, 'null']
          format: uuid
          description: 消息归属的轮次；未关联轮次时为 null
        toolCallId:
          type: [string, 'null']
          format: uuid
          description: TOOL 角色消息对应的工具调用 ID；其他角色为 null

    ConversationDetail:
      type: object
      additionalProperties: false
      required: [conversation, messages]
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          maxItems: 100
          description: 按轮次顺序升序排列的最近消息，最多 100 条；同一轮次内按写入时间排序，跨轮次迟到的工具消息归位到所属轮次，不会插入后续轮次
          items:
            $ref: '#/components/schemas/ConversationMessage'

    ConversationDetailResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ConversationDetail'
        requestId:
          type: [string, 'null']
          description: 公开 API 请求追踪 ID

    CreateTurnRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [content]
          properties:
            content:
              type: string
              minLength: 1
        - required: [imageFileIds]
          properties:
            imageFileIds:
              type: array
              minItems: 1
        - required: [fileIds]
          properties:
            fileIds:
              type: array
              minItems: 1
      properties:
        content:
          type: [string, 'null']
          minLength: 1
          maxLength: 262144
          description: 本轮 user 消息正文；历史消息与摘要由服务端加载
        imageFileIds:
          type: array
          maxItems: 8
          minItems: 1
          uniqueItems: true
          description: Stable image FileObject IDs referenced by this user message
          items:
            type: string
            format: uuid
        fileIds:
          type: array
          maxItems: 8
          minItems: 1
          uniqueItems: true
          description: Stable document FileObject IDs referenced by this user message; the API extracts text and injects it into the trusted conversation context
          items:
            type: string
            format: uuid
        mode:
          allOf:
            - $ref: '#/components/schemas/ChatMode'
          description: 本轮对话执行模式；省略时使用会话的默认模式
        knowledgeBaseEnabled:
          type: boolean
          default: false
          description: 本轮是否允许检索知识库；省略时默认关闭。开启后 AI 可获得知识库检索工具，检索范围按用户权限折叠
        webSearchEnabled:
          type: boolean
          default: false
          description: 本轮是否允许联网搜索；省略时默认关闭。关闭时 AI 不获得联网检索工具；若用户消息明确提到需要联网，服务端可为本轮自动临时启用并在 started 事件回传（见 TurnCapabilities.autoEnabled）
        connectorContexts:
          type: array
          maxItems: 3
          description: Desktop 从用户已授权的本地连接器取得的本轮结构化结果；不会作为业务事实或后续写操作权限依据
          items:
            $ref: '#/components/schemas/ConnectorContext'

    ConnectorContext:
      type: object
      additionalProperties: false
      required: [provider, toolId, toolName, fetchedAt, data]
      properties:
        provider:
          type: string
          enum: [DINGTALK, TENCENT_MEETING, WECOM, GITHUB]
        toolId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[A-Za-z][A-Za-z0-9._-]{0,119}$'
          description: Stable local connector tool ID; DWS uses a derived ID while Tencent Meeting and WeCom use provider tool names
        toolName:
          type: string
          minLength: 1
          maxLength: 240
          description: DWS Schema canonical_path, retained for source display and audit context
        fetchedAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          description: 已脱敏的连接器结构化结果，不得包含 Token、Cookie、AppSecret 或授权凭据

    TencentMeetingConnectorToolRisk:
      type: string
      enum: [READ, WRITE, DESTRUCTIVE]

    TencentMeetingConnectorTool:
      type: object
      additionalProperties: false
      required: [toolId, name, description, parameters, riskLevel, requiresConfirmation]
      properties:
        toolId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[A-Za-z][A-Za-z0-9._-]{0,119}$'
          description: Version-aligned Tencent Meeting CLI command ID, for example meeting.list
        name:
          type: string
          minLength: 1
          maxLength: 240
        description:
          type: string
          minLength: 1
          maxLength: 4000
        parameters:
          type: object
          additionalProperties: true
          description: JSON Schema derived from the pinned official CLI command help; root must be an object
        riskLevel:
          $ref: '#/components/schemas/TencentMeetingConnectorToolRisk'
        requiresConfirmation:
          type: boolean
          description: Desktop must require explicit confirmation before executing this tool

    TencentMeetingConnectorPlanRequest:
      type: object
      additionalProperties: false
      required: [query, tools]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 10000
        tools:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/TencentMeetingConnectorTool'

    TencentMeetingConnectorPlannedCall:
      type: object
      additionalProperties: false
      required: [toolId, arguments]
      properties:
        toolId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[A-Za-z][A-Za-z0-9._-]{0,119}$'
        arguments:
          type: object
          additionalProperties: true

    TencentMeetingConnectorPlanResult:
      type: object
      additionalProperties: false
      required: [calls]
      properties:
        calls:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/TencentMeetingConnectorPlannedCall'

    TencentMeetingConnectorPlanResponseEnvelope:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TencentMeetingConnectorPlanResult'
        requestId:
          type: [string, 'null']
          description: Public API request trace ID

    WeComConnectorToolRisk:
      type: string
      enum: [READ, WRITE, DESTRUCTIVE]

    WeComConnectorTool:
      type: object
      additionalProperties: false
      required: [toolId, name, description, parameters, riskLevel, requiresConfirmation]
      properties:
        toolId:
          type: string
          minLength: 1
