          in: query
          schema: { $ref: '#/components/schemas/TaskPriority' }
        - { name: assigneeMembershipId, in: query, schema: { type: string, format: uuid } }
        - { name: parentId, in: query, schema: { type: string, format: uuid } }
        - { name: rootOnly, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 当前项目任务列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponseEnvelope' }
        '401': { description: 登录状态无效, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '403': { description: 缺少 task.read 权限, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '404': { description: 项目不存在或当前成员不是项目成员, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
    post:
      summary: 创建项目任务
      operationId: taskCreate
      tags: [Task]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: 已创建任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponseEnvelope' }
        '400': { description: 父任务、负责人、协作人或字段无效, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '403': { description: 缺少 task.create 权限, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '404': { description: 项目不存在或当前成员不是项目成员, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }
        '409': { description: 项目只读或任务层级冲突, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' } } } }

