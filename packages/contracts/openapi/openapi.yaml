        填写 tokenMultiplier 与 creditPerToken；PER_REQUEST 维度填写 perRequestCredits。
        同一组合已存在未删除行时返回 409。
      operationId: aiCreditRateCardCreate
      tags: [AI Credit Config]
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
