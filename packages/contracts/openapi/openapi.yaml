        createMissingMembers: { type: boolean, default: true }

    DingTalkDepartmentMappingResolution:
      type: object
      additionalProperties: false
      required: [dingtalkDepartmentId, action]
      properties:
        dingtalkDepartmentId: { type: string, format: uuid }
        action: { type: string, enum: [BIND_EXISTING, CREATE, SKIP] }
        departmentId: { type: [string, 'null'], format: uuid }

    DingTalkUserMappingResolution:
      type: object
      additionalProperties: false
      required: [dingtalkUserId, action]
      properties:
        dingtalkUserId: { type: string, format: uuid }
        action: { type: string, enum: [BIND_EXISTING, CREATE, SKIP] }
        membershipId: { type: [string, 'null'], format: uuid }
        account: { type: [string, 'null'], minLength: 3, maxLength: 32, pattern: '^[A-Za-z0-9]+$' }

    DingTalkRoleAssignment:
      type: object
      additionalProperties: false
      required: [roleId, dingtalkUserIds]
      properties:
        roleId: { type: string, format: uuid }
        dingtalkUserIds:
          type: array
          uniqueItems: true
          maxItems: 1000
          items: { type: string, format: uuid }

    ApplyDingTalkMappingRequest:
      allOf:
        - $ref: '#/components/schemas/PreviewDingTalkMappingRequest'
        - type: object
          properties:
            departmentResolutions:
              type: array
              items: { $ref: '#/components/schemas/DingTalkDepartmentMappingResolution' }
            userResolutions:
              type: array
              items: { $ref: '#/components/schemas/DingTalkUserMappingResolution' }
            roleAssignments:
              type: array
              items: { $ref: '#/components/schemas/DingTalkRoleAssignment' }

    DingTalkDepartmentMappingPreview:
      type: object
      required: [dingtalkDepartmentId, externalDepartmentId, name, path, action, departmentId, candidateDepartmentIds, reason]
      properties:
        dingtalkDepartmentId: { type: string, format: uuid }
        externalDepartmentId: { type: string }
        name: { type: string }
        path: { type: string }
        action: { type: string, enum: [MATCH_EXISTING, CREATE, CONFLICT, SKIP] }
        departmentId: { type: [string, 'null'], format: uuid }
        candidateDepartmentIds: { type: array, items: { type: string, format: uuid } }
        reason: { type: string }

    DingTalkUserMappingPreview:
      type: object
      required: [dingtalkUserId, externalUserId, name, departmentPaths, action, membershipId, candidateMembershipIds, suggestedAccount, reason]
      properties:
        dingtalkUserId: { type: string, format: uuid }
        externalUserId: { type: string }
        name: { type: string }
        departmentPaths: { type: array, items: { type: string } }
        action: { type: string, enum: [MATCH_EXISTING, CREATE, CONFLICT, SKIP] }
        membershipId: { type: [string, 'null'], format: uuid }
        candidateMembershipIds: { type: array, items: { type: string, format: uuid } }
        suggestedAccount: { type: string, pattern: '^[A-Za-z0-9]+$' }
        reason: { type: string }

    DingTalkMappingSummary:
      type: object
      required: [departmentMatchedCount, departmentCreateCount, departmentConflictCount, userMatchedCount, userCreateCount, userConflictCount]
      properties:
        departmentMatchedCount: { type: integer, minimum: 0 }
        departmentCreateCount: { type: integer, minimum: 0 }
        departmentConflictCount: { type: integer, minimum: 0 }
        userMatchedCount: { type: integer, minimum: 0 }
        userCreateCount: { type: integer, minimum: 0 }
        userConflictCount: { type: integer, minimum: 0 }

    DingTalkMappingPreview:
      type: object
      required: [activationExpiresInDays, departments, users, summary]
      properties:
        activationExpiresInDays: { type: integer, minimum: 1, maximum: 30 }
        departments: { type: array, items: { $ref: '#/components/schemas/DingTalkDepartmentMappingPreview' } }
        users: { type: array, items: { $ref: '#/components/schemas/DingTalkUserMappingPreview' } }
        summary: { $ref: '#/components/schemas/DingTalkMappingSummary' }

    DingTalkMappingCredential:
      type: object
      required: [dingtalkUserId, membershipId, displayName, account, departmentId, tenantCode, roleIds, roleCodes, activationToken, activationExpiresAt]
      properties:
        dingtalkUserId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        displayName: { type: string }
        account: { type: string, pattern: '^[A-Za-z0-9]+$' }
        departmentId: { type: [string, 'null'], format: uuid }
        tenantCode: { type: string }
        roleIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        roleCodes: { type: array, uniqueItems: true, items: { type: string } }
        activationToken: { type: string, format: password }
        activationExpiresAt: { type: string, format: date-time }

    DingTalkMappingResult:
      type: object
      required: [preview, credentials, summary]
      properties:
        preview: { $ref: '#/components/schemas/DingTalkMappingPreview' }
        credentials: { type: array, items: { $ref: '#/components/schemas/DingTalkMappingCredential' } }
        summary:
          allOf:
            - $ref: '#/components/schemas/DingTalkMappingSummary'
            - type: object
              required: [departmentSkippedCount, userSkippedCount]
              properties:
                departmentSkippedCount: { type: integer, minimum: 0 }
                userSkippedCount: { type: integer, minimum: 0 }

