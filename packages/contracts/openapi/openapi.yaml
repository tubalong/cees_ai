            schema: { $ref: '#/components/schemas/PreviewDingTalkMappingRequest' }
      responses:
        '200':
          description: 映射预览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DingTalkMappingPreviewResponseEnvelope' }
        '401': { description: 登录状态无效或已过期 }
        '403': { description: 缺少 dingtalk.organization.mapping.preview 权限 }
        '404': { description: 当前租户尚未绑定钉钉企业 }

  /dingtalk/organization/mapping/apply:
