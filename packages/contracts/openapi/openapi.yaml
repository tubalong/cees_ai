openapi: 3.1.0
info:
  title: CEES AI API
  version: 0.4.0
  description: 以本文件为唯一事实源的公开 API 契约。资源与操作按 docs/api 约定补充。

servers:
  - url: http://localhost:3000/api/v1

paths:
  /health:
    get:
      summary: 健康检查
      operationId: health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /auth/login:
    post:
      summary: 使用租户编码、邮箱和密码登录
      operationId: authLogin
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录凭证无效或账户不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/refresh:
    post:
      summary: 使用 Refresh Token 轮换访问令牌和刷新令牌
      operationId: authRefresh
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 令牌轮换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: Refresh Token 无效、过期或已被使用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/logout:
    post:
      summary: 撤销当前登录会话
      operationId: authLogout
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 当前会话已撤销
        "401":
          description: Access Token 无效或 Session 已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /auth/me:
    get:
      summary: 获取当前用户、租户、角色和权限
      operationId: authMe
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前认证上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponseEnvelope"
        "401":
          description: Access Token 无效或 Session 已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current:
    get:
      summary: 获取当前租户
      operationId: tenantGetCurrent
      tags:
        - Tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 tenant.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    patch:
      summary: 修改当前租户
      operationId: tenantUpdateCurrent
      tags:
        - Tenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: 修改后的租户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 tenant.update 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current/members:
    get:
      summary: 查询当前租户成员
      operationId: tenantListMembers
      tags:
        - Tenant
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MemberStatus"
        - name: roleId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 当前租户成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMemberListResponseEnvelope"
        "400":
          description: 查询参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 member.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current/members/{membershipId}:
    parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 获取当前租户成员详情
      operationId: tenantGetMember
      tags:
        - Tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成员详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMemberResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 member.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内成员不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    patch:
      summary: 修改当前租户成员
      operationId: tenantUpdateMember
      tags:
        - Tenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantMemberRequest"
      responses:
        "200":
          description: 修改后的成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMemberResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 member.update 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内成员或部门不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 最后一名管理员、自操作或版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    delete:
      summary: 移除当前租户成员
      operationId: tenantRemoveMember
      tags:
        - Tenant
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 成员已移除且相关 Session 已撤销
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 member.remove 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内成员不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 不能移除自己或最后一名管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /tenants/current/members/{membershipId}/roles:
    parameters:
      - name: membershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: 替换当前租户成员的角色集合
      operationId: tenantReplaceMemberRoles
      tags:
        - Tenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceTenantMemberRolesRequest"
      responses:
        "200":
          description: 更新角色后的成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMemberResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 role.assign 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内成员或角色不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 最后一名管理员或版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /permissions:
    get:
      summary: 获取平台预置权限目录
      operationId: rbacListPermissions
      tags: [RBAC]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 权限目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 role.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /roles:
    get:
      summary: 获取当前租户角色列表
      operationId: rbacListRoles
      tags: [RBAC]
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 当前租户角色列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 role.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    post:
      summary: 创建当前租户角色
      operationId: rbacCreateRole
      tags: [RBAC]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: 已创建角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 role.create 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 角色编码已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 获取当前租户角色详情
      operationId: rbacGetRole
      tags: [RBAC]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 角色详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 role.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内角色不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    patch:
      summary: 修改当前租户角色
      operationId: rbacUpdateRole
      tags: [RBAC]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: 修改后的角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 role.update 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内角色不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 系统角色不可修改或版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
    delete:
      summary: 删除当前租户角色
      operationId: rbacDeleteRole
      tags: [RBAC]
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: 角色已删除
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 role.delete 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内角色不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 系统角色、角色正在使用或版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /roles/{roleId}/permissions:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: 替换当前租户角色权限集合
      operationId: rbacReplaceRolePermissions
      tags: [RBAC]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolePermissionsRequest"
      responses:
        "200":
          description: 权限替换后的角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponseEnvelope"
        "400":
          description: 请求字段校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 role.update 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内角色或权限不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 系统角色不可修改或版本冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /audit-events:
    get:
      summary: 查询当前租户审计事件
      operationId: auditListEvents
      tags: [Audit]
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
            maxLength: 100
        - name: outcome
          in: query
          schema:
            $ref: "#/components/schemas/AuditOutcome"
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: membershipId
          in: query
          schema:
            type: string
            format: uuid
        - name: resourceType
          in: query
          schema:
            type: string
            maxLength: 100
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
        - name: requestId
          in: query
          schema:
            type: string
            maxLength: 128
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 当前租户审计事件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponseEnvelope"
        "400":
          description: 查询参数或分页游标无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 audit.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /audit-events/{auditEventId}:
    parameters:
      - name: auditEventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 获取当前租户审计事件详情
      operationId: auditGetEvent
      tags: [Audit]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 审计事件详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "403":
          description: 缺少 audit.read 权限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前租户内审计事件不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - tenantCode
        - email
        - password
      properties:
        tenantCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
        deviceName:
          type: string
          minLength: 1
          maxLength: 100

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 512

    AuthUser:
      type: object
      required:
        - id
        - email
        - displayName
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string

    AuthTenant:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string

    AuthMembership:
      type: object
      required:
        - id
        - status
        - roles
      properties:
