              schema: { $ref: '#/components/schemas/KnowledgeBaseResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少 knowledge_base.read 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库不存在或当前成员无权访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

    patch:
      summary: 修改知识库
      description: 必须提交当前 version；修改成功后版本号递增。
      operationId: updateKnowledgeBase
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateKnowledgeBaseRequest' }
      responses:
        '200':
          description: 知识库已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeBaseResponseEnvelope' }
        '400':
          description: 请求字段校验失败或没有可修改字段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
          description: 缺少知识库 MANAGER 权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '404':
          description: 知识库不存在或当前成员无权访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '409':
          description: version 与服务端当前版本不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }

    delete:
