      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: includeDeleted
          in: query
          description: 是否包含已从钉钉组织中删除的部门
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 钉钉部门镜像列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DingTalkDepartmentListResponseEnvelope' }
        '400': { description: 分页参数无效 }
        '401': { description: 登录状态无效或已过期 }
        '403': { description: 缺少 dingtalk.organization.read 权限 }
        '404': { description: 当前租户尚未绑定钉钉企业 }

  /dingtalk/organization/users:
    get:
