      description: 软删除知识库，必须提交当前 version。
      operationId: deleteKnowledgeBase
      tags: [KnowledgeBase]
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          description: 当前知识库版本
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: 知识库已软删除
        '400':
          description: 请求字段校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '401':
          description: 登录状态无效或缺少有效租户成员身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponseEnvelope' }
        '403':
