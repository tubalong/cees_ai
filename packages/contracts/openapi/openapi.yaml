        "200":
          description: PPTX 演示文稿文件
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              description: 附件文件名，含 ASCII 回退与 RFC 5987 UTF-8 文件名
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        "400":
          description: 文档没有可导出的生成规格
          content:
