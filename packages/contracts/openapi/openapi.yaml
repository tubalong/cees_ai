  /upload-sessions:
    post:
      summary: 创建单文件 COS 直传会话
      description: >-
        为当前登录成员生成仅绑定单一 COS 对象键的短时 PUT URL。对象键由服务端按照
        cees/{environment}/tenants/{tenantId}/files/{yyyy}/{mm}/{fileId}/source 生成，
        客户端不得指定租户、Bucket 或对象键。
      operationId: fileCreateUploadSession
      tags: [File]
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一成员重试同一请求时复用的幂等键
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "201":
          description: 已创建上传会话并签发短时 PUT URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponseEnvelope"
        "400":
          description: 请求字段、文件类型或幂等键无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
          description: 幂等键已用于不同请求或对应会话已不可继续上传
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "410":
          description: 幂等键对应的待上传会话已经过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "413":
          description: 文件超过当前技术上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "502":
          description: COS 上传地址签发失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"

  /upload-sessions/{uploadSessionId}/complete:
    post:
      summary: 校验并完成 COS 直传会话
      description: >-
        向 COS 发起 HEAD 请求校验对象存在、大小和 Content-Type，校验通过后创建正式文件记录。
        客户端调用本接口不代表服务端会信任客户端声明的上传结果。
      operationId: fileCompleteUploadSession
      tags: [File]
      security:
        - bearerAuth: []
      parameters:
        - name: uploadSessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 上传对象校验通过并已登记为正式文件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileMetadataResponseEnvelope"
        "400":
          description: 上传会话 ID 不是有效 UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "401":
          description: 登录状态无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "404":
          description: 当前成员的上传会话不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseEnvelope"
        "409":
