name: cees-ai-production

services:
  postgres:
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - postgres_production_data:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - redis_production_data:/data

  ai-service:
    restart: unless-stopped

  api:
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  postgres_production_data:
  redis_production_data:
