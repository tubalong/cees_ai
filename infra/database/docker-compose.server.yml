services:
  postgres:
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${DB_BIND_IP}:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${DB_BIND_IP}:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
