name: cees-ai-staging

services:
  postgres:
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - redis_staging_data:/data

  ai-service:
    restart: unless-stopped

  api:
    restart: unless-stopped
    ports:
      - "${API_PORT:-13000}:3000"

volumes:
  postgres_staging_data:
  redis_staging_data:
