services:
  migrate:
    image: "${API_IMAGE:-cees-api}:${IMAGE_TAG:-latest}"
    command:
      - node
      - node_modules/prisma/build/index.js
      - migrate
      - deploy
      - --schema
      - prisma/schema.prisma
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  seed-platform-admin:
    image: "${API_IMAGE:-cees-api}:${IMAGE_TAG:-latest}"
    command:
      - node
      - dist/cli/seed-platform-administrator.js
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_PLATFORM_ADMIN_ACCOUNT: ${SEED_PLATFORM_ADMIN_ACCOUNT}
      SEED_PLATFORM_ADMIN_PASSWORD: ${SEED_PLATFORM_ADMIN_PASSWORD}
      SEED_PLATFORM_ADMIN_DISPLAY_NAME: ${SEED_PLATFORM_ADMIN_DISPLAY_NAME}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  ai-service:
    image: "${AI_SERVICE_IMAGE:-cees-ai-service}:${IMAGE_TAG:-latest}"
    environment:
      NODE_ENV: ${NODE_ENV}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      AI_DOCS_ENABLED: ${AI_DOCS_ENABLED:-false}
      AI_MODEL_CONFIG_PATH: /run/config/ai-models.toml
      # 模型配置通过 profile 的 api_key_env 按名称读取这些变量；缺少任一已启用
      # profile 对应的变量都会让 /ready 返回 503，容器被判定为 unhealthy。
      PRIMARY_LLM_API_KEY: ${PRIMARY_LLM_API_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      VISION_LLM_API_KEY: ${VISION_LLM_API_KEY:-}
      IMAGE_GEN_API_KEY: ${IMAGE_GEN_API_KEY:-}
      IMAGE_GEN_BACKUP_API_KEY: ${IMAGE_GEN_BACKUP_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BACKUP_API_KEY: ${EMBEDDING_BACKUP_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 知识库向量库（pgvector 为独立数据库；memory 用于开发/测试）。
      KNOWLEDGE_VECTOR_STORE: ${KNOWLEDGE_VECTOR_STORE:-memory}
      KNOWLEDGE_VECTOR_DATABASE_URL: ${KNOWLEDGE_VECTOR_DATABASE_URL:-}
      KNOWLEDGE_VECTOR_DIMENSION: ${KNOWLEDGE_VECTOR_DIMENSION:-512}
    volumes:
      - type: bind
        source: ${AI_MODEL_CONFIG_HOST_PATH}
        target: /run/config/ai-models.toml
        read_only: true
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import http.client,sys; connection=http.client.HTTPConnection('localhost',8000,timeout=3); connection.request('GET','/ready'); response=connection.getresponse(); body=response.read().decode(); print(body); sys.exit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: "${API_IMAGE:-cees-api}:${IMAGE_TAG:-latest}"
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_PLATFORM_ACCESS_SECRET: ${JWT_PLATFORM_ACCESS_SECRET}
      JWT_PLATFORM_ACCESS_TTL: ${JWT_PLATFORM_ACCESS_TTL}
      JWT_PLATFORM_REFRESH_TTL: ${JWT_PLATFORM_REFRESH_TTL}
      TENANT_INVITATION_TTL: ${TENANT_INVITATION_TTL}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET}
      TENCENT_COS_OBJECT_PREFIX: ${TENCENT_COS_OBJECT_PREFIX}
      TENCENT_COS_SIGNED_URL_TTL_SECONDS: ${TENCENT_COS_SIGNED_URL_TTL_SECONDS}
      TENCENT_COS_UPLOAD_MAX_BYTES: ${TENCENT_COS_UPLOAD_MAX_BYTES:-104857600}
      DINGTALK_API_BASE_URL: ${DINGTALK_API_BASE_URL:-https://oapi.dingtalk.com}
      DINGTALK_CREDENTIAL_ENCRYPTION_KEY: ${DINGTALK_CREDENTIAL_ENCRYPTION_KEY}
      CEES_GITHUB_OAUTH_CLIENT_ID: ${CEES_GITHUB_OAUTH_CLIENT_ID:?CEES_GITHUB_OAUTH_CLIENT_ID must be configured}
      CEES_GITHUB_OAUTH_CLIENT_SECRET: ${CEES_GITHUB_OAUTH_CLIENT_SECRET:?CEES_GITHUB_OAUTH_CLIENT_SECRET must be configured}
      AI_SERVICE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      # MinerU 文档解析服务（宿主机常驻 mineru-api；未配置时文档置 FAILED）。
      MINERU_API_URL: ${MINERU_API_URL:-}
      MINERU_API_TIMEOUT_MS: ${MINERU_API_TIMEOUT_MS:-1800000}
      MINERU_API_LANG_LIST: ${MINERU_API_LANG_LIST:-ch}
      # 知识库向量化：索引侧与查询侧必须使用同一 embedding profile。
      # pgvector 部署下应指向 ai-service 模型目录中已启用的 profile（如 primary），
      # 未配置时回落 deterministic（384 维哈希，仅适合本地内存向量库开发/测试）。
      KNOWLEDGE_EMBEDDING_PROFILE: ${KNOWLEDGE_EMBEDDING_PROFILE:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:?WEB_SEARCH_API_KEY must be configured}
      WEB_SEARCH_TIMEOUT_MS: ${WEB_SEARCH_TIMEOUT_MS:-15000}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_SEARCH_MAX_SNIPPET_CHARS: ${WEB_SEARCH_MAX_SNIPPET_CHARS:-1500}
      WEB_SEARCH_SEARCH_DEPTH: ${WEB_SEARCH_SEARCH_DEPTH:-advanced}
      API_PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed-platform-admin:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:3000/api/v1/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
