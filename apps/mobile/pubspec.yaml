name: cees_mobile
description: CEES AI mobile client
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.1

dependency_overrides:
  # objective_c 9.6.1 references Architecture.arm64e, which is unavailable in
  # the Dart SDK bundled by the Flutter 3.47.2 CI toolchain.
  objective_c: 9.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

# 2026-09-15: objective_c 9.6.1 的 native assets hook 引用了 Dart 3.11（Flutter 3.47.2）
# 尚未提供的 Architecture.arm64e，导致 CI flutter test 编译 hook 失败；
# 临时固定到 9.6.0，待上游发布修复版本后移除此 override。
dependency_overrides:
  objective_c: 9.6.0
