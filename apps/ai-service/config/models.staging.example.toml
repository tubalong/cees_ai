[profiles.primary]
enabled = true
provider = "deepseek"
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
api_key_env = "PRIMARY_LLM_API_KEY"
modes = ["text", "json_schema"]
capabilities = ["chat", "tool_calling"]
temperature = 0.0
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 2
structured_output_method = "function_calling"

[profiles.backup-qwen]
enabled = true
provider = "openai_compatible"
model = "qwen-max"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "QWEN_API_KEY"
modes = ["text", "json_schema"]
capabilities = ["chat", "tool_calling"]
temperature = 0.0
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 1
structured_output_method = "function_calling"

# Dedicated multimodal chat profile. Replace model/base_url and provide a real
# VISION_LLM_API_KEY; readiness rejects the example values. Add "vision-primary"
# to the roles that may receive image_url content parts.
[profiles.vision-primary]
enabled = true
provider = "openai_compatible"
model = "change_me"
base_url = "https://change_me/v1"
api_key_env = "VISION_LLM_API_KEY"
modes = ["text"]
capabilities = ["chat", "vision", "tool_calling"]
temperature = 0.0
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 2
structured_output_method = "function_calling"

# 视觉备用链路。推荐与 vision-primary 不同厂商，避免同一 provider 同时不可用。
# orchestrator 角色的所有候选都必须声明 tool_calling。
[profiles.vision-backup]
enabled = true
provider = "openai_compatible"
model = "qwen-vl-max"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "QWEN_API_KEY"
modes = ["text"]
capabilities = ["chat", "vision", "tool_calling"]
temperature = 0.0
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 1
structured_output_method = "function_calling"

[chat]
compaction_role = "default"
compaction_max_output_tokens = 2048
compaction_context_budget_tokens = 1048576

[chat.modes.standard]
role = "default"
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
context_budget_tokens = 1048576
emit_reasoning_status = false

[chat.modes.ultra]
role = "reasoning"
reasoning_effort = "high"
default_max_output_tokens = 8192
max_output_tokens_limit = 393216
context_budget_tokens = 1048576
emit_reasoning_status = true

[image_profiles.primary]
enabled = true
provider = "openai_compatible"
model = "gpt-image-2"
base_url = "https://www.aikeyhub.top/v1"
api_key_env = "IMAGE_GEN_API_KEY"
timeout_seconds = 60.0
max_retries = 2

[image_profiles.backup]
enabled = true
provider = "openai_compatible"
model = "gpt-image-1"
base_url = "https://www.aikeyhub.top/v1"
api_key_env = "IMAGE_GEN_BACKUP_API_KEY"
timeout_seconds = 60.0
max_retries = 1

# Embedding 只服务知识库索引与检索。staging 使用 pgvector，且 .env.staging
# 已声明 KNOWLEDGE_EMBEDDING_PROFILE=primary，因此这里必须有一个名为 primary
# 的 profile 并指向测试环境的 BGE 服务；dimension 必须等于
# KNOWLEDGE_VECTOR_DIMENSION（staging 为 512）。
[embedding_profiles.primary]
enabled = false
provider = "openai_compatible"
model = "bge-small-zh-v1.5"
base_url = "https://change_me/v1"
api_key_env = "EMBEDDING_API_KEY"
dimension = 512
timeout_seconds = 60.0
max_retries = 2

# 备用 embedding。维度必须与 primary 一致，否则回退会把不同向量空间
# 写进同一个索引版本。默认关闭，配置好 EMBEDDING_BACKUP_API_KEY 后再启用。
[embedding_profiles.backup]
enabled = false
provider = "openai_compatible"
model = "bge-small-zh-v1.5"
base_url = "https://change_me/v1"
api_key_env = "EMBEDDING_BACKUP_API_KEY"
dimension = 512
timeout_seconds = 60.0
max_retries = 1

[roles]
# 候选按声明顺序回退：只有可重试的瞬时失败才会尝试下一个 profile。
# 请求含图片时只保留声明了 vision capability 的候选（vision-primary → vision-backup）。
default = ["primary", "backup-qwen", "vision-primary", "vision-backup"]
structured = ["primary", "backup-qwen"]
reasoning = ["primary", "backup-qwen"]
rag = ["primary", "backup-qwen"]
orchestrator = ["primary", "backup-qwen", "vision-primary", "vision-backup"]
orchestration_decision = ["primary", "backup-qwen"]
archive_suggestion = ["primary", "backup-qwen"]

[extraction]
max_bytes = 10485760
max_part_text_chars = 200000
