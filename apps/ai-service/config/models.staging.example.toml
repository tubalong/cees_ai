[profiles.primary]
provider = "deepseek"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "PRIMARY_LLM_API_KEY"
enabled = true
modes = ["text", "json_schema"]
temperature = 0.0
default_max_output_tokens = 2048
max_output_tokens_limit = 8192
timeout_seconds = 60.0
max_retries = 2
structured_output_method = "function_calling"

[roles]
default = ["primary"]
structured = ["primary"]
reasoning = ["primary"]
rag = ["primary"]
