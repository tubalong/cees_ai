[profiles.primary]
enabled = true
provider = "deepseek"
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
api_key_env = "PRIMARY_LLM_API_KEY"
modes = ["text", "json_schema"]
capabilities = ["chat", "tool_calling"]
temperature = 0.0
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 2
structured_output_method = "function_calling"

[profiles.backup]
enabled = true
provider = "deepseek"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "BACKUP_LLM_API_KEY"
modes = ["text", "json_schema"]
capabilities = ["chat", "tool_calling"]
temperature = 0.0
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 1
structured_output_method = "function_calling"

# Dedicated multimodal chat profile. Keep it disabled until a real vision-capable
# model and VISION_LLM_API_KEY are provided. When enabled, add "vision-primary"
# to the roles that may receive image_url content parts.
[profiles.vision-primary]
enabled = true
provider = "openai_compatible"
model = "change_me"
base_url = "https://change_me/v1"
api_key_env = "VISION_LLM_API_KEY"
modes = ["text"]
capabilities = ["chat", "vision", "tool_calling"]
temperature = 0.0
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 2
structured_output_method = "function_calling"

[chat]
compaction_role = "default"
compaction_max_output_tokens = 2048
compaction_context_budget_tokens = 1048576

[chat.modes.standard]
role = "default"
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
context_budget_tokens = 1048576
emit_reasoning_status = false

[chat.modes.ultra]
role = "reasoning"
reasoning_effort = "high"
default_max_output_tokens = 8192
max_output_tokens_limit = 393216
context_budget_tokens = 1048576
emit_reasoning_status = true

[image_profiles.primary]
enabled = true
provider = "openai_compatible"
model = "gpt-image-2"
base_url = "https://www.aikeyhub.top/v1/image"
api_key_env = "IMAGE_GEN_API_KEY"
timeout_seconds = 60.0
max_retries = 2

[roles]
default = ["primary", "backup", "vision-primary"]
structured = ["primary", "backup"]
reasoning = ["primary", "backup"]
rag = ["primary", "backup"]
orchestrator = ["primary", "backup", "vision-primary"]

[extraction]
max_bytes = 10485760
max_part_text_chars = 200000
