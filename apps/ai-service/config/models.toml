# Development defaults. Production must point AI_MODEL_CONFIG_PATH at a deployment-owned file.
[profiles.mock]
enabled = true
provider = "mock"
model = "mock-text-v1"
modes = ["text"]
capabilities = ["chat"]
temperature = 0.7
default_max_output_tokens = 1024
max_output_tokens_limit = 4096
timeout_seconds = 30.0
max_retries = 0
structured_output_method = "function_calling"

# Example profiles are disabled until their API key environment variables are configured.
[profiles.primary]
enabled = true
provider = "deepseek"
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "PRIMARY_LLM_API_KEY"
modes = ["text", "json_schema"]
capabilities = ["chat", "tool_calling"]
temperature = 0.7
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 2
structured_output_method = "function_calling"

[profiles.backup-qwen]
enabled = true
provider = "openai_compatible"
model = "qwen-max"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "QWEN_API_KEY"
modes = ["text", "json_schema"]
capabilities = ["chat", "tool_calling"]
temperature = 0.7
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 1
structured_output_method = "function_calling"

# Dedicated multimodal chat profile. DeepSeek `deepseek-flash` accepts `image_url`
# content parts, so this dev profile is enabled. VISION_LLM_API_KEY must hold a real
# key (never the .env.example placeholder), otherwise ai-service reports the profile
# as not configured instead of failing opaquely at request time.
# `vision-primary` is listed in the roles that may receive `image_url` content
# parts (default, orchestrator). Point this at a dedicated vision model and key in
# staging and production.
[profiles.vision-primary]
enabled = true
provider = "deepseek"
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "VISION_LLM_API_KEY"
modes = ["text"]
capabilities = ["chat", "vision", "tool_calling"]
temperature = 0.7
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 2
structured_output_method = "function_calling"

# 视觉备用链路：主视觉 profile 失败时回退到 Qwen-VL。复用 QWEN_API_KEY，
# 不额外引入必须配置的环境变量。orchestrator 角色的所有候选都必须声明
# tool_calling，否则解析阶段直接报 UNSUPPORTED_TOOL_CALLING；若该模型在
# 你的账号下不支持 function calling，请把它从 default / orchestrator 移除。
[profiles.vision-backup]
enabled = true
provider = "openai_compatible"
model = "qwen-vl-max"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "QWEN_API_KEY"
modes = ["text"]
capabilities = ["chat", "vision", "tool_calling"]
temperature = 0.7
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
timeout_seconds = 60.0
max_retries = 1
structured_output_method = "function_calling"

[chat]
compaction_role = "default"
compaction_max_output_tokens = 2048
compaction_context_budget_tokens = 1048576

[chat.modes.standard]
role = "default"
default_max_output_tokens = 2048
max_output_tokens_limit = 393216
context_budget_tokens = 1048576
emit_reasoning_status = false

[chat.modes.ultra]
role = "reasoning"
reasoning_effort = "high"
default_max_output_tokens = 8192
max_output_tokens_limit = 393216
context_budget_tokens = 1048576
emit_reasoning_status = true

[image_profiles.mock]
enabled = false
provider = "mock"
model = "mock-image-v1"
timeout_seconds = 30.0
max_retries = 0

[image_profiles.primary]
enabled = true
provider = "openai_compatible"
model = "gpt-image-2"
base_url = "https://www.aikeyhub.top/v1"
api_key_env = "IMAGE_GEN_API_KEY"
timeout_seconds = 60.0
max_retries = 2

# The image router tries enabled profiles in declaration order. Keep this
# profile after primary so transient primary failures can use the backup model.
[image_profiles.backup]
enabled = true
provider = "openai_compatible"
model = "gpt-image-1"
base_url = "https://www.aikeyhub.top/v1"
api_key_env = "IMAGE_GEN_BACKUP_API_KEY"
timeout_seconds = 60.0
max_retries = 1

# Embedding profiles serve knowledge indexing and retrieval only; the
# deterministic provider is built in and needs no declaration. The first
# enabled profile becomes the default when requests omit embedding_profile.
# Keep it disabled until EMBEDDING_API_KEY is configured.
[embedding_profiles.primary]
enabled = false
provider = "openai_compatible"
model = "text-embedding-3-small"
base_url = "https://www.aikeyhub.top/v1"
api_key_env = "EMBEDDING_API_KEY"
dimension = 1536
timeout_seconds = 60.0
max_retries = 2

# 备用 embedding。维度必须与 primary 完全一致（也与 KNOWLEDGE_VECTOR_DIMENSION
# 一致），否则切换后会把不同向量空间写进同一个索引版本。默认关闭，
# 配置好 EMBEDDING_BACKUP_API_KEY 后再启用。
[embedding_profiles.backup]
enabled = false
provider = "openai_compatible"
model = "text-embedding-3-small"
base_url = "https://www.aikeyhub.top/v1"
api_key_env = "EMBEDDING_BACKUP_API_KEY"
dimension = 1536
timeout_seconds = 60.0
max_retries = 1

[roles]
# 候选按声明顺序回退：只有可重试的瞬时失败才会尝试下一个 profile。
# 请求含图片时只保留声明了 vision capability 的候选（vision-primary → vision-backup）。
default = ["primary", "backup-qwen", "vision-primary", "vision-backup"]
structured = ["primary", "backup-qwen"]
reasoning = ["primary", "backup-qwen"]
rag = ["primary", "backup-qwen"]
orchestrator = ["primary", "backup-qwen", "vision-primary", "vision-backup"]
orchestration_decision = ["primary", "backup-qwen"]

[extraction]
max_bytes = 10485760
max_part_text_chars = 200000
