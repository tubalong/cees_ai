# Development defaults. Production must point AI_MODEL_CONFIG_PATH at a deployment-owned file.
[profiles.mock]
enabled = true
provider = "mock"
model = "mock-text-v1"
modes = ["text"]
capabilities = ["chat"]
temperature = 0.7
default_max_output_tokens = 1024
max_output_tokens_limit = 4096
timeout_seconds = 30.0
max_retries = 0
structured_output_method = "function_calling"

# Example profiles are disabled until their API key environment variables are configured.
[profiles.primary]
enabled = true
provider = "deepseek"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "PRIMARY_LLM_API_KEY"
modes = ["text", "json_schema"]
capabilities = ["chat", "tool_calling"]
temperature = 0.7
default_max_output_tokens = 2048
max_output_tokens_limit = 32768
timeout_seconds = 60.0
max_retries = 2
structured_output_method = "function_calling"

[profiles.backup]
enabled = false
provider = "openai_compatible"
model = "change_me"
base_url = "https://change_me/v1"
api_key_env = "BACKUP_LLM_API_KEY"
modes = ["text", "json_schema"]
capabilities = ["chat", "tool_calling"]
temperature = 0.7
default_max_output_tokens = 2048
max_output_tokens_limit = 32768
timeout_seconds = 60.0
max_retries = 1
structured_output_method = "function_calling"

[chat]
compaction_role = "default"
compaction_max_output_tokens = 2048
compaction_context_budget_tokens = 65536

[chat.modes.standard]
role = "default"
default_max_output_tokens = 2048
max_output_tokens_limit = 8192
context_budget_tokens = 65536
emit_reasoning_status = false

[chat.modes.ultra]
role = "reasoning"
reasoning_effort = "high"
default_max_output_tokens = 8192
max_output_tokens_limit = 32768
context_budget_tokens = 131072
emit_reasoning_status = true

[image_profiles.mock]
enabled = true
provider = "mock"
model = "mock-image-v1"
timeout_seconds = 30.0
max_retries = 0

[roles]
default = ["primary"]
structured = ["primary"]
reasoning = ["primary"]
rag = ["primary"]
orchestrator = ["primary"]
