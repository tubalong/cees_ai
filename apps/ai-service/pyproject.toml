[project]
name = "cees-ai-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "jsonschema",
    "langchain",
    "langchain-openai",
    "langgraph",
    "llama-index-core",
    "llama-index-embeddings-langchain",
    "llama-index-llms-langchain",
    "openai",
    "pydantic-settings",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "datamodel-code-generator",
    "pytest",
    "pytest-asyncio",
    "pyyaml>=6.0.3",
    "ruff",
]

[tool.uv]
package = false
required-version = "==0.12.7"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["app/api/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
